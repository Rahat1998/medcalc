{id:'bx_alt',n:'ALT Interpretation',a:'Alanine Aminotransferase',c:'biochem',d:'ALT is a sensitive marker of hepatocellular injury. Normal: M <45 U/L, F <35 U/L.',f:'ALT degree of elevation → clinical context',
 F:[{i:'alt',l:'ALT',p:'e.g. 65',u:['U/L'],cv:function(v){return v}},
    {i:'alt_uln',l:'ULN for your lab (M=45, F=35 typical)',p:'e.g. 45',u:['U/L'],cv:function(v){return v}}],
 calc:function(v){return(v.alt/v.alt_uln).toFixed(1)},
 ru:'× ULN',refs:['<1×:Normal','1-3×:Mild','3-10×:Moderate','>10×:Marked elevation','>100×:Ischaemia/viral/toxic'],
 interp:function(r){var v=+r;if(v<1)return rn('Normal ALT',v+'× ULN — No hepatocellular injury indicated.');if(v<3)return rl('Mild Elevation',v+'× ULN — Non-alcoholic fatty liver, alcohol, medications, thyroid, exercise. Repeat in 4-6 wk.');if(v<10)return rw('Moderate Elevation',v+'× ULN — Viral hepatitis, drug-induced injury, autoimmune hepatitis. Hepatology workup.');if(v<100)return rh('Marked Elevation',v+'× ULN — Acute hepatitis, ischaemia, drug toxicity. Urgent evaluation.');return rh('Severe / Acute Liver Injury',v+'× ULN — Ischaemic hepatitis, acute viral hepatitis, toxin (paracetamol). Emergency management.')}},

{id:'bx_ast',n:'AST Interpretation',a:'Aspartate Aminotransferase',c:'biochem',d:'AST/ALT ratio >2:1 suggests alcoholic liver disease. Less specific than ALT for liver.',f:'AST/ULN ratio + AST:ALT ratio',
 F:[{i:'ast',l:'AST',p:'e.g. 80',u:['U/L'],cv:function(v){return v}},
    {i:'alt2',l:'ALT (for ratio)',p:'e.g. 40',u:['U/L'],cv:function(v){return v}},
    {i:'ast_uln',l:'AST ULN (typical 40 U/L)',p:'e.g. 40',u:['U/L'],cv:function(v){return v}}],
 calc:function(v){var ratio=(v.ast/v.alt2).toFixed(2);var xULN=(v.ast/v.ast_uln).toFixed(1);return xULN+','+ratio},
 ru:'',
 interp:function(r){var p=r.split(',');var xULN=+p[0],ratio=+p[1];
  var ratioStr=ratio>2?'AST:ALT >2 — Suggests alcoholic liver disease or cirrhosis.':ratio>1?'AST:ALT 1-2 — Non-specific pattern.':'AST:ALT <1 — More typical of non-alcoholic hepatocellular injury.';
  if(xULN<1)return rn('Normal AST',xULN+'× ULN. '+ratioStr);if(xULN<3)return rl('Mild Elevation',xULN+'× ULN. '+ratioStr);if(xULN<10)return rw('Moderate Elevation',xULN+'× ULN. '+ratioStr);return rh('Marked Elevation',xULN+'× ULN. '+ratioStr+' Urgent evaluation.')}},

{id:'bx_ggt',n:'GGT Interpretation',a:'Gamma-Glutamyl Transferase',c:'biochem',d:'GGT elevated in alcohol use, cholestasis, medications, metabolic syndrome. Not specific alone.',f:'Degree of elevation → context',
 F:[{i:'ggt',l:'GGT',p:'e.g. 90',u:['U/L'],cv:function(v){return v}},
    {i:'ggt_uln',l:'GGT ULN (M=55, F=38 typical)',p:'e.g. 55',u:['U/L'],cv:function(v){return v}},
    {i:'ggt_alp',l:'ALP (for cholestasis pattern)',p:'e.g. 100',u:['U/L'],cv:function(v){return v}}],
 calc:function(v){return(v.ggt/v.ggt_uln).toFixed(1)+','+(v.ggt>v.ggt_uln&&v.ggt_alp>120?'cholest':'other')},
 ru:'× ULN',
 interp:function(r){var p=r.split(',');var xULN=+p[0],pat=p[1];
  var ctx=pat==='cholest'?'GGT + ALP elevation: cholestasis pattern. Consider MRCP/ultrasound.':'Isolated GGT: alcohol use, metabolic syndrome, medications, or fatty liver.';
  if(xULN<1)return rn('Normal GGT',xULN+'× ULN. '+ctx);if(xULN<3)return rl('Mild Elevation',xULN+'× ULN. '+ctx);if(xULN<10)return rw('Moderate Elevation',xULN+'× ULN. '+ctx);return rh('Marked Elevation',xULN+'× ULN. Urgent hepatology assessment. '+ctx)}},

{id:'bx_alp',n:'ALP Interpretation',a:'Alkaline Phosphatase',c:'biochem',d:'ALP elevated in bone disease, cholestasis, or pregnancy. GGT co-elevation confirms hepatic origin.',f:'ALP/ULN + GGT pattern',
 F:[{i:'alp',l:'ALP',p:'e.g. 200',u:['U/L'],cv:function(v){return v}},
    {i:'alp_uln',l:'ALP ULN (typical 120 U/L)',p:'e.g. 120',u:['U/L'],cv:function(v){return v}},
    {i:'alp_ggt',l:'GGT elevated? (1=Yes)',p:'0/1',u:['pts'],cv:function(v){return v}}],
 calc:function(v){return(v.alp/v.alp_uln).toFixed(1)+','+v.alp_ggt},
 ru:'× ULN',
 interp:function(r){var p=r.split(',');var xULN=+p[0],ggt=+p[1];
  var src=ggt?'GGT elevated — hepatic origin confirmed. Consider cholestasis, PBC, PSC, drugs, infiltration.':'GGT normal — bone source likely. Consider Paget’s, bone metastases, hyperparathyroidism, growth.';
  if(xULN<1)return rn('Normal ALP',xULN+'× ULN.');if(xULN<2)return rl('Mild Elevation',xULN+'× ULN. '+src);if(xULN<5)return rw('Moderate Elevation',xULN+'× ULN. '+src);return rh('Marked Elevation',xULN+'× ULN. '+src+' Urgent imaging.')}},

{id:'bx_bili_dir',n:'Bilirubin Fractionation',a:'Direct vs Indirect Bilirubin',c:'biochem',d:'Direct (conjugated) >50% of total = hepatocellular or cholestatic. Indirect dominant = haemolysis or Gilbert’s.',f:'Direct% = Direct/(Total) × 100',
 F:[{i:'tbili',l:'Total Bilirubin',p:'e.g. 3.5',u:['mg/dL','µmol/L'],cv:function(v,u){return UC.bili(v,u)}},
    {i:'dbili',l:'Direct (Conjugated) Bilirubin',p:'e.g. 0.8',u:['mg/dL','µmol/L'],cv:function(v,u){return UC.bili(v,u)}}],
 calc:function(v){var pct=(v.dbili/v.tbili*100).toFixed(0);return v.tbili.toFixed(2)+','+pct},
 ru:'',
 interp:function(r){var p=r.split(',');var tot=+p[0],pct=+p[1];var ibil=(tot*(1-pct/100)).toFixed(2);
  if(tot<1.2)return rn('Normal Bilirubin','Total '+tot+' mg/dL. No pathological jaundice.');
  if(pct<20)return rw('Indirect (Unconjugated) Dominant','Direct '+pct+'%. Indirect predominant ('+ibil+' mg/dL). Haemolysis, Gilbert’s syndrome, ineffective erythropoiesis.');
  if(pct<50)return rw('Mixed Pattern','Direct '+pct+'%. Hepatocellular disease or mixed origin. LFT + viral hepatitis screen.');
  return rh('Direct (Conjugated) Dominant','Direct '+pct+'% of total '+tot+' mg/dL. Hepatocellular disease or cholestasis. MRCP/ultrasound.')}},

{id:'bx_tp',n:'Total Protein Interpretation',a:'Serum Total Protein',c:'biochem',d:'Normal 60-80 g/L. Hyperproteinaemia → paraprotein screen (SPEP). Hypoproteinaemia → nutritional/liver/loss.',f:'Total Protein → clinical pattern',
 F:[{i:'tp',l:'Total Protein',p:'e.g. 70',u:['g/L','g/dL'],cv:function(v,u){return UC.tp(v,u)}},
    {i:'tp_alb',l:'Albumin',p:'e.g. 38',u:['g/L','g/dL'],cv:function(v,u){return UC.alb(v,u)}}],
 calc:function(v){var glob=(v.tp-v.tp_alb).toFixed(1);var ratio=(v.tp_alb/glob).toFixed(2);return v.tp.toFixed(1)+','+glob+','+ratio},
 ru:'g/L',
 interp:function(r){var p=r.split(',');var tp=+p[0],glob=+p[1],ratio=+p[2];
  var agStr='A:G ratio '+ratio+(ratio<1?' (reversed A:G — chronic liver disease, myeloma, inflammation)':ratio>2.5?' (high A:G — unusual, verify)':' (normal)');
  if(tp<60)return rw('Hypoproteinaemia','Total protein '+tp+' g/L, Globulins '+glob+' g/L. '+agStr+'. Causes: malnutrition, liver disease, nephrotic syndrome, protein-losing enteropathy.');
  if(tp>85)return rw('Hyperproteinaemia','Total protein '+tp+' g/L, Globulins '+glob+' g/L. '+agStr+'. Consider SPEP/SFLC for paraprotein. Dehydration.');
  return rn('Normal Total Protein','Total protein '+tp+' g/L, Globulins '+glob+' g/L. '+agStr+'.')}},

{id:'bx_ldh',n:'LDH Interpretation',a:'Lactate Dehydrogenase',c:'biochem',d:'LDH released by cell injury. Non-specific but useful for haemolysis, lymphoma, hepatocellular injury.',f:'LDH/ULN → clinical context',
 F:[{i:'ldh',l:'LDH',p:'e.g. 350',u:['U/L'],cv:function(v){return v}},
    {i:'ldh_uln',l:'LDH ULN (typical 250 U/L)',p:'e.g. 250',u:['U/L'],cv:function(v){return v}}],
 calc:function(v){return(v.ldh/v.ldh_uln).toFixed(1)},
 ru:'× ULN',refs:['<1×:Normal','1-2×:Mild','2-5×:Moderate','>5×:Marked'],
 interp:function(r){var v=+r;if(v<1)return rn('Normal LDH',v+'× ULN.');if(v<2)return rl('Mild Elevation',v+'× ULN. Non-specific. Consider haemolysis, liver disease, or vigorous exercise.');if(v<5)return rw('Moderate Elevation',v+'× ULN. Evaluate for haemolysis (haptoglobin, retics, smear), lymphoma, acute liver injury, or pulmonary embolism.');return rh('Marked Elevation',v+'× ULN. Haemolysis, high-grade lymphoma, hepatic infarction, rhabdomyolysis. Urgent evaluation.')}},

{id:'bx_ck',n:'CK Interpretation',a:'Creatine Kinase',c:'biochem',d:'CK-MM = skeletal muscle. CK-MB = cardiac. CK-BB = brain (rarely measured). Normal M <200, F <150 U/L.',f:'CK/ULN → pattern',
 F:[{i:'ck',l:'CK (Total)',p:'e.g. 1200',u:['U/L'],cv:function(v){return v}},
    {i:'ck_uln',l:'CK ULN (M=200, F=150 typical)',p:'e.g. 200',u:['U/L'],cv:function(v){return v}},
    {i:'ck_mb',l:'CK-MB (if available)',p:'e.g. 12',u:['U/L'],cv:function(v){return v}},
    {i:'ck_mb_pct',l:'CK-MB % of total (>5-6% = cardiac)',p:'auto or enter %',u:['%'],cv:function(v){return v}}],
 calc:function(v){var xULN=(v.ck/v.ck_uln).toFixed(1);var mbPct=v.ck_mb>0?(v.ck_mb/v.ck*100).toFixed(1):v.ck_mb_pct;return xULN+','+mbPct},
 ru:'× ULN',
 interp:function(r){var p=r.split(',');var xULN=+p[0],mbPct=+p[1];
  var cardiac=mbPct>5.6?'CK-MB '+mbPct+'% (>5.6%) — Cardiac source likely. Correlate with troponin and ECG.':'CK-MB '+mbPct+'% (≤5.6%) — Predominantly skeletal muscle source.';
  if(xULN<1)return rn('Normal CK',xULN+'× ULN. '+cardiac);if(xULN<5)return rl('Mild Elevation',xULN+'× ULN. '+cardiac+' Consider vigorous exercise, statins, hypothyroidism, IM injections.');if(xULN<10)return rw('Moderate Elevation',xULN+'× ULN. '+cardiac+' Inflammatory myopathy, myocarditis, trauma.');if(xULN<50)return rh('Marked Elevation',xULN+'× ULN. Rhabdomyolysis territory. Monitor renal function and urine myoglobin.');return rh('Severe Elevation — Rhabdomyolysis',xULN+'× ULN. Aggressive IV hydration. Target urine output >200 mL/hr. Monitor K⁺, creatinine, Ca²⁺.')}},

{id:'bx_amm',n:'Ammonia Interpretation',a:'Serum Ammonia',c:'biochem',d:'Elevated in hepatic encephalopathy, urea cycle disorders, GI bleeding. Level correlates poorly with grade of HE.',f:'Ammonia level → clinical context',
 F:[{i:'nh3',l:'Ammonia',p:'e.g. 80',u:['µmol/L','µg/dL'],cv:function(v,u){return u==='µg/dL'?v*0.5872:v}}],
 calc:function(v){return v.nh3.toFixed(0)},
 ru:'µmol/L',refs:['Normal:<47','Mild HE:47-100','Moderate/Severe HE:>100','Coma-range:>200'],
 interp:function(r){var v=+r;if(v<47)return rn('Normal Ammonia',v+' µmol/L. Hepatic encephalopathy unlikely (though level-grade correlation is poor).');if(v<100)return rw('Elevated Ammonia',v+' µmol/L. Hepatic encephalopathy possible. Assess precipitants (GI bleed, infection, constipation, diuretics). Lactulose/rifaximin.');return rh('Markedly Elevated',v+' µmol/L. Severe hepatic dysfunction. Treat precipitants. Consider liver transplant evaluation. Ensure sample handled correctly (ice, rapid processing).')}},

{id:'bx_uric',n:'Uric Acid Interpretation',a:'Serum Urate',c:'biochem',d:'Hyperuricaemia >420 µmol/L (M) or >360 (F). Risk for gout, nephrolithiasis, CKD.',f:'Serum urate → clinical risk',
 F:[{i:'ua',l:'Uric Acid',p:'e.g. 480',u:['µmol/L','mg/dL'],cv:function(v,u){return u==='mg/dL'?v*59.48:v}}],
 sex:1,
 calc:function(v){return v.ua.toFixed(0)},
 ru:'µmol/L',refs:['M normal:<420','F normal:<360','Gout target:<360','Crystal formation:>420'],
 interp:function(r,s){var v=+r;var thr=s==='F'?360:420;var mgdl=(v/59.48).toFixed(1);if(v<thr)return rn('Normal Urate',v+' µmol/L ('+mgdl+' mg/dL). Within normal range for '+s+'.');if(v<500)return rw('Hyperuricaemia',v+' µmol/L. Asymptomatic hyperuricaemia. Lifestyle modification: reduce red meat, purine-rich foods, alcohol, fructose. Increase hydration.');if(v<600)return rh('Significant Hyperuricaemia',v+' µmol/L. Gout risk high. If symptomatic: ULT (allopurinol/febuxostat) to target <360 µmol/L.');return rh('Severe Hyperuricaemia',v+' µmol/L. Very high crystal deposition risk. Review medications (diuretics, ciclosporin). Initiate urate-lowering therapy.')}},

{id:'bx_prot_cr',n:'Protein:Creatinine Ratio (Urine)',a:'Urine PCR / Proteinuria',c:'biochem',d:'Spot urine protein:creatinine ratio approximates 24h urine protein. PCR ≥30 mg/mmol = significant proteinuria.',f:'Protein (mg/L) ÷ Creatinine (mmol/L)',
 F:[{i:'u_prot',l:'Urine Protein',p:'e.g. 300',u:['mg/L','g/L'],cv:function(v,u){return u==='g/L'?v*1000:v}},
    {i:'u_cr',l:'Urine Creatinine',p:'e.g. 10',u:['mmol/L','mg/dL'],cv:function(v,u){return u==='mg/dL'?v*0.08841:v}}],
 calc:function(v){return(v.u_prot/v.u_cr).toFixed(1)},
 ru:'mg/mmol',refs:['<15:Normal','15-30:Mildly increased (A2)','30-300:Moderately increased (A3)','>300:Severely increased — nephrotic range'],
 interp:function(r){var v=+r;if(v<15)return rn('Normal PCR',v+' mg/mmol. No significant proteinuria.');if(v<30)return rl('Mildly Increased',v+' mg/mmol. CKD Albuminuria A2. Monitor. Optimise BP (<130/80) and RAS blockade.');if(v<300)return rw('Moderately Increased',v+' mg/mmol. CKD Albuminuria A3. Nephrology referral. ACE inhibitor / ARB. Dietary protein restriction.');return rh('Severely Increased / Nephrotic',v+' mg/mmol. Nephrotic range. Serum albumin, lipids, renal biopsy consideration. Nephrology referral.')}},

{id:'bx_acr',n:'Albumin:Creatinine Ratio (Urine)',a:'Microalbuminuria Screen',c:'biochem',d:'ACR is the preferred method for CKD and diabetic nephropathy screening. ACR ≥3 mg/mmol = significant.',f:'Albumin (mg/L) ÷ Creatinine (mmol/L)',
 F:[{i:'u_alb',l:'Urine Albumin',p:'e.g. 45',u:['mg/L','mg/g (as mg/mmol×0.113)'],cv:function(v,u){return u==='mg/g (as mg/mmol×0.113)'?v*0.113:v}},
    {i:'u_cr2',l:'Urine Creatinine',p:'e.g. 10',u:['mmol/L','mg/dL'],cv:function(v,u){return u==='mg/dL'?v*0.08841:v}}],
 calc:function(v){return(v.u_alb/v.u_cr2).toFixed(2)},
 ru:'mg/mmol',refs:['<3:Normal (A1)','3-30:Moderately increased (A2)','>30:Severely increased (A3)','>220:Nephrotic range'],
 interp:function(r){var v=+r;if(v<3)return rn('Normal ACR',v+' mg/mmol. No significant albuminuria.');if(v<30)return rw('Moderately Increased (A2)',v+' mg/mmol. Microalbuminuria. Confirm with 2 of 3 early morning samples. ACE-I/ARB. BP optimisation.');if(v<220)return rh('Severely Increased (A3)',v+' mg/mmol. Macroalbuminuria. Nephrology referral. Aggressive RAS blockade. HbA1c <53 mmol/mol if diabetic.');return rh('Nephrotic-Range ACR',v+' mg/mmol. Urgent nephrology. Serum albumin, consider renal biopsy.')}},

{id:'bx_osmgap',n:'Osmol Gap',a:'Serum Osmol Gap',c:'biochem',d:'Osmol gap >10 mOsm/kg suggests unmeasured osmoles (methanol, ethanol, ethylene glycol, mannitol, severe lactic acidosis).',f:'Measured Osm − Calculated Osm; Calculated = 2×Na + Glucose/18 + BUN/2.8',
 F:[{i:'osm_meas',l:'Measured Osmolality',p:'e.g. 310',u:['mOsm/kg'],cv:function(v){return v}},
    {i:'osm_na',l:'Sodium',p:'e.g. 138',u:['mEq/L'],cv:function(v){return v}},
    {i:'osm_glu',l:'Glucose',p:'e.g. 90',u:['mg/dL','mmol/L'],cv:function(v,u){return UC.glu(v,u)}},
    {i:'osm_bun',l:'BUN / Urea Nitrogen',p:'e.g. 14',u:['mg/dL','mmol/L'],cv:function(v,u){return UC.bun(v,u)}}],
 calc:function(v){var calc=2*v.osm_na+v.osm_glu/18+v.osm_bun/2.8;var gap=v.osm_meas-calc;return gap.toFixed(1)+','+calc.toFixed(0)},
 ru:'mOsm/kg',refs:['Normal:<10 mOsm/kg','Elevated:10-20','Significant:>20','Critical:>50'],
 interp:function(r){var p=r.split(',');var gap=+p[0],calc=+p[1];if(gap<10)return rn('Normal Osmol Gap','Gap '+gap+' mOsm/kg (Calculated Osm: '+calc+'). No significant unmeasured osmoles.');if(gap<20)return rw('Mildly Elevated Gap','Gap '+gap+' mOsm/kg. Repeat. Consider early toxic alcohol ingestion, mannitol, severe hyperlipidaemia.');if(gap<50)return rh('Significant Osmol Gap','Gap '+gap+' mOsm/kg. Toxic alcohol (methanol, ethylene glycol, isopropanol), mannitol, or severe lactic acidosis. Toxicology screen. Ethanol level.');return rh('Critical Osmol Gap','Gap '+gap+' mOsm/kg. Very high. Emergency toxicology. Methanol or ethylene glycol poisoning. Fomepizole ± haemodialysis.')}},

{id:'bx_phos',n:'Phosphate Interpretation',a:'Serum Phosphate',c:'biochem',d:'Hypophosphataemia <0.8 mmol/L. Hyperphosphataemia >1.45 mmol/L. Critical in refeeding syndrome and CKD.',f:'Phosphate level → clinical risk',
 F:[{i:'phos',l:'Phosphate',p:'e.g. 0.6',u:['mmol/L','mg/dL'],cv:function(v,u){return u==='mg/dL'?v*0.3229:v}}],
 calc:function(v){return v.phos.toFixed(2)},
 ru:'mmol/L',refs:['Normal:0.8-1.45 mmol/L','Mild hypo:0.6-0.8','Moderate hypo:0.32-0.6','Severe hypo:<0.32','Hyperphosphataemia:>1.45'],
 interp:function(r){var v=+r;var mgdl=(v/0.3229).toFixed(1);if(v>=0.8&&v<=1.45)return rn('Normal Phosphate',v+' mmol/L ('+mgdl+' mg/dL).');if(v<0.32)return rh('Severe Hypophosphataemia',v+' mmol/L. Refeeding syndrome, severe malabsorption, hyperparathyroidism. IV phosphate replacement. Monitor cardiac and respiratory function.');if(v<0.6)return rh('Moderate Hypophosphataemia',v+' mmol/L. Oral or IV phosphate replacement. Review cause: malabsorption, DKA treatment, respiratory alkalosis, alcohol withdrawal.');if(v<0.8)return rw('Mild Hypophosphataemia',v+' mmol/L. Oral phosphate supplement. Dietary optimisation. Review cause.');return rh('Hyperphosphataemia',v+' mmol/L ('+mgdl+' mg/dL). CKD, hypoparathyroidism, rhabdomyolysis. Phosphate binders. Dietary restriction (<800 mg/day). Nephrology review.')}},

{id:'bx_mg',n:'Magnesium Interpretation',a:'Serum Magnesium',c:'biochem',d:'Magnesium critical for cardiac, neuromuscular, and glucose metabolism. Hypomagnesaemia often accompanies hypokalaemia.',f:'Serum Mg → clinical risk',
 F:[{i:'mg',l:'Magnesium',p:'e.g. 0.7',u:['mmol/L','mg/dL','mEq/L'],cv:function(v,u){return u==='mg/dL'?v*0.4114:u==='mEq/L'?v*0.5:v}}],
 calc:function(v){return v.mg.toFixed(2)},
 ru:'mmol/L',refs:['Normal:0.7-1.0 mmol/L','Mild hypo:0.5-0.7','Severe hypo:<0.5','Hypermagnesaemia:>1.1'],
 interp:function(r){var v=+r;var mgdl=(v/0.4114).toFixed(1);if(v>=0.7&&v<=1.0)return rn('Normal Magnesium',v+' mmol/L ('+mgdl+' mg/dL).');if(v<0.5)return rh('Severe Hypomagnesaemia',v+' mmol/L. IV magnesium sulphate. Cardiac monitoring (long QT, arrhythmia). Correct concomitant hypokalaemia and hypocalcaemia.');if(v<0.7)return rw('Hypomagnesaemia',v+' mmol/L. Oral magnesium supplement (magnesium glycinate/oxide). Review diuretics, PPI use, alcohol intake, diabetes.');return rw('Hypermagnesaemia',v+' mmol/L. Renal failure, excess supplementation, antacid overuse. Stop Mg supplements. Haemodialysis if severe (>3 mmol/L).')}},

// ── BLOOD TESTS (CBC / HAEMATOLOGY PANEL) ─────────────────────────────────
{id:'bt_hgb',n:'Haemoglobin Interpretation',a:'Hgb / Anaemia Screen',c:'blood',d:'WHO anaemia thresholds: Hgb <130 g/L (M), <120 g/L (F), <110 g/L (pregnant).',f:'Hgb level \u2192 anaemia severity',
 F:[{i:'hgb',l:'Haemoglobin',p:'e.g. 105',u:['g/L','g/dL'],cv:function(v,u){return u==='g/dL'?v*10:v}}],
 sex:1,
 calc:function(v){return v.hgb.toFixed(0)},
 ru:'g/L',refs:['M normal:\u2265130','F normal:\u2265120','Mild anaemia:110-119(F)/100-129(M)','Moderate:80-109','Severe:<80'],
 interp:function(r,s){var v=+r;var thr=s==='F'?120:130;var gdl=(v/10).toFixed(1);if(v>=thr)return rn('Normal Haemoglobin',v+' g/L ('+gdl+' g/dL). No anaemia.');if(v>=110)return rl('Mild Anaemia',v+' g/L. Investigate cause: iron studies, B12/folate, reticulocyte count.');if(v>=80)return rw('Moderate Anaemia',v+' g/L. Symptomatic likely. Urgent workup. Consider transfusion if symptomatic or cardiac history.');return rh('Severe Anaemia',v+' g/L. High risk of cardiac decompensation. Urgent transfusion assessment. Identify and treat underlying cause.')}},

{id:'bt_mcv',n:'MCV Classification',a:'Mean Corpuscular Volume',c:'blood',d:'Classifies anaemia by red cell size: microcytic, normocytic, or macrocytic.',f:'MCV \u2192 morphological category',
 F:[{i:'mcv',l:'MCV',p:'e.g. 75',u:['fL'],cv:function(v){return v}}],
 calc:function(v){return v.mcv.toFixed(1)},
 ru:'fL',refs:['Microcytic:<80','Normocytic:80-100','Macrocytic:>100'],
 interp:function(r){var v=+r;if(v<80)return rw('Microcytic Anaemia Pattern','MCV '+v+' fL. Iron deficiency, thalassaemia, chronic disease, sideroblastic anaemia. Check ferritin, Hb electrophoresis.');if(v<=100)return rn('Normocytic Pattern','MCV '+v+' fL. Acute blood loss, chronic disease, renal failure, haemolysis, mixed deficiency.');return rw('Macrocytic Pattern','MCV '+v+' fL. B12/folate deficiency, liver disease, hypothyroidism, myelodysplasia, alcohol excess, reticulocytosis.')}},

{id:'bt_retic',n:'Reticulocyte Production Index',a:'Corrected Reticulocyte / RPI',c:'blood',d:'Assesses bone marrow erythropoietic response to anaemia. RPI <2 = inadequate marrow response.',f:'RPI = (Retic% \u00d7 Hct/45) \u00f7 Maturation factor',
 F:[{i:'retic',l:'Reticulocyte %',p:'e.g. 3.5',u:['%'],cv:function(v){return v}},
    {i:'hct',l:'Haematocrit',p:'e.g. 28',u:['%'],cv:function(v){return v}}],
 calc:function(v){var corrRetic=(v.retic*v.hct/45).toFixed(2);var matFactor=v.hct<25?2.5:v.hct<35?1.5:1;var rpi=(corrRetic/matFactor).toFixed(2);return corrRetic+','+rpi},
 ru:'',
 interp:function(r){var p=r.split(',');var cr=+p[0],rpi=+p[1];if(rpi<2)return rw('Inadequate Marrow Response','Corrected retic '+cr+'%, RPI '+rpi+'. Hypoproliferative anaemia \u2014 iron/B12/folate deficiency, marrow failure, chronic disease. Bone marrow evaluation may be needed.');return rn('Adequate Marrow Response','Corrected retic '+cr+'%, RPI '+rpi+'. Appropriate response \u2014 consistent with haemolysis or blood loss with intact marrow.')}},

{id:'bt_wbc_diff',n:'WBC Differential Interpreter',a:'Absolute Neutrophil/Lymphocyte',c:'blood',d:'Converts WBC differential percentages to absolute counts for clinical interpretation.',f:'Absolute count = Total WBC \u00d7 (%/100)',
 F:[{i:'wbc_tot',l:'Total WBC',p:'e.g. 8.0',u:['\u00d710\u2079/L'],cv:function(v){return v}},
    {i:'neut_pct',l:'Neutrophils %',p:'e.g. 60',u:['%'],cv:function(v){return v}},
    {i:'lymph_pct',l:'Lymphocytes %',p:'e.g. 30',u:['%'],cv:function(v){return v}}],
 calc:function(v){var anc=(v.wbc_tot*v.neut_pct/100).toFixed(2);var alc=(v.wbc_tot*v.lymph_pct/100).toFixed(2);return anc+','+alc},
 ru:'\u00d710\u2079/L',
 interp:function(r){var p=r.split(',');var anc=+p[0],alc=+p[1];
  var ancStr=anc<0.5?'Severe neutropenia (ANC<0.5) \u2014 high infection risk, neutropenic precautions.':anc<1.5?'Neutropenia (ANC<1.5) \u2014 monitor for infection.':anc>7.5?'Neutrophilia \u2014 infection, inflammation, steroids, stress.':'Normal ANC.';
  var alcStr=alc<1?'Lymphopenia \u2014 viral infection, immunosuppression, steroids.':alc>4?'Lymphocytosis \u2014 viral infection, CLL, pertussis (consider age).':'Normal ALC.';
  var risk=anc<0.5?rh:anc<1.5||alc<1?rw:rn;
  return risk('ANC '+anc+' / ALC '+alc+' (\u00d710\u2079/L)',ancStr+' '+alcStr)}},

{id:'bt_iron_panel',n:'Iron Studies Panel',a:'Iron / TIBC / Ferritin / Transferrin Saturation',c:'blood',d:'Differentiates iron deficiency from chronic disease anaemia using transferrin saturation.',f:'TSAT% = Serum Iron \u00f7 TIBC \u00d7 100',
 F:[{i:'fe',l:'Serum Iron',p:'e.g. 40',u:['\u00b5g/dL','\u00b5mol/L'],cv:function(v,u){return u==='\u00b5mol/L'?v*5.587:v}},
    {i:'tibc',l:'TIBC',p:'e.g. 450',u:['\u00b5g/dL','\u00b5mol/L'],cv:function(v,u){return u==='\u00b5mol/L'?v*5.587:v}},
    {i:'ferr',l:'Ferritin',p:'e.g. 8',u:['ng/mL'],cv:function(v){return v}}],
 sex:1,
 calc:function(v){var tsat=(v.fe/v.tibc*100).toFixed(1);return tsat+','+v.ferr},
 ru:'% saturation',
 interp:function(r,s){var p=r.split(',');var tsat=+p[0],ferr=+p[1];var ferrThr=s==='F'?20:30;
  if(tsat<16&&ferr<ferrThr)return rh('Iron Deficiency','TSAT '+tsat+'%, Ferritin '+ferr+' ng/mL. Classic iron deficiency pattern. Oral/IV iron replacement. Investigate source of loss (GI, menstrual).');
  if(tsat<16&&ferr>=100)return rw('Anaemia of Chronic Disease/Inflammation','TSAT '+tsat+'%, Ferritin '+ferr+' ng/mL (elevated as acute phase reactant). Treat underlying inflammatory/chronic condition.');
  if(tsat>45&&ferr>300)return rw('Iron Overload Pattern','TSAT '+tsat+'%, Ferritin '+ferr+' ng/mL. Consider haemochromatosis, transfusion overload, liver disease. HFE genetic testing.');
  return rn('Normal/Indeterminate Iron Status','TSAT '+tsat+'%, Ferritin '+ferr+' ng/mL. Correlate with clinical picture and MCV.')}},

{id:'bt_b12_folate',n:'B12 / Folate Deficiency',a:'Macrocytic Anaemia Workup',c:'blood',d:'B12 <200 pg/mL and folate <3 ng/mL indicate deficiency. Both cause macrocytic anaemia.',f:'B12 + Folate levels \u2192 deficiency pattern',
 F:[{i:'b12',l:'Vitamin B12',p:'e.g. 150',u:['pg/mL','pmol/L'],cv:function(v,u){return u==='pmol/L'?v/0.738:v}},
    {i:'fol',l:'Folate',p:'e.g. 2',u:['ng/mL','nmol/L'],cv:function(v,u){return u==='nmol/L'?v/2.266:v}}],
 calc:function(v){return v.b12.toFixed(0)+','+v.fol.toFixed(1)},
 ru:'',
 interp:function(r){var p=r.split(',');var b12=+p[0],fol=+p[1];
  var b12Str=b12<200?'B12 deficient':b12<300?'B12 borderline':'B12 normal';
  var folStr=fol<3?'Folate deficient':fol<4?'Folate borderline':'Folate normal';
  if(b12<200||fol<3)return rh('Deficiency Confirmed',b12Str+' ('+b12+' pg/mL), '+folStr+' ('+fol+' ng/mL). Replace deficient vitamin. Check intrinsic factor/parietal cell antibodies if B12 low. Investigate malabsorption.');
  if(b12<300||fol<4)return rw('Borderline Levels',b12Str+' ('+b12+' pg/mL), '+folStr+' ('+fol+' ng/mL). Consider methylmalonic acid/homocysteine for functional B12 deficiency.');
  return rn('Normal B12/Folate',b12Str+' ('+b12+' pg/mL), '+folStr+' ('+fol+' ng/mL).')}},

{id:'bt_haptoglobin',n:'Haemolysis Panel',a:'Haptoglobin / LDH / Bilirubin Triad',c:'blood',d:'Classic haemolysis triad: low haptoglobin + high LDH + high indirect bilirubin.',f:'3-marker concordance for haemolysis',
 F:[{i:'hap',l:'Haptoglobin',p:'e.g. 15',u:['mg/dL'],cv:function(v){return v}},
    {i:'ldh_h',l:'LDH (\u00d7ULN)',p:'e.g. 2.5',u:['\u00d7 ULN'],cv:function(v){return v}},
    {i:'ibili',l:'Indirect Bilirubin',p:'e.g. 2.5',u:['mg/dL'],cv:function(v){return v}}],
 calc:function(v){var score=(v.hap<30?1:0)+(v.ldh_h>1.5?1:0)+(v.ibili>1.2?1:0);return score+','+v.hap+','+v.ldh_h+','+v.ibili},
 ru:'markers positive',
 interp:function(r){var p=r.split(',');var score=+p[0],hap=+p[1],ldh=+p[2],ibil=+p[3];
  if(score>=3)return rh('Haemolysis Confirmed','All 3 markers positive: Haptoglobin '+hap+' mg/dL (low), LDH '+ldh+'\u00d7ULN (high), Indirect bilirubin '+ibil+' mg/dL (high). Direct Coombs test, peripheral smear, reticulocyte count.');
  if(score===2)return rw('Probable Haemolysis','2/3 markers positive. Haptoglobin '+hap+', LDH '+ldh+'\u00d7, Indirect bili '+ibil+'. Repeat testing, correlate with reticulocyte count and smear.');
  return rn('Haemolysis Unlikely','Only '+score+'/3 markers positive. Haptoglobin '+hap+', LDH '+ldh+'\u00d7, Indirect bili '+ibil+'.')}},

{id:'bt_plt_interp',n:'Platelet Count Interpretation',a:'Thrombocytopenia/Thrombocytosis',c:'blood',d:'Normal range 150-450\u00d710\u2079/L. Bleeding risk increases significantly below 20-30.',f:'Platelet count \u2192 clinical risk',
 F:[{i:'plt',l:'Platelet Count',p:'e.g. 45',u:['\u00d710\u2079/L'],cv:function(v){return v}}],
 calc:function(v){return v.plt.toFixed(0)},
 ru:'\u00d710\u2079/L',refs:['Normal:150-450','Mild thrombocytopenia:100-149','Moderate:50-99','Severe:20-49','Critical:<20','Thrombocytosis:>450'],
 interp:function(r){var v=+r;if(v>=150&&v<=450)return rn('Normal Platelet Count',v+' \u00d710\u2079/L.');if(v<20)return rh('Critical Thrombocytopenia',v+' \u00d710\u2079/L. High spontaneous bleeding risk. Platelet transfusion threshold. Urgent haematology.');if(v<50)return rh('Severe Thrombocytopenia',v+' \u00d710\u2079/L. Avoid invasive procedures without transfusion. Investigate cause (ITP, marrow failure, DIC, drug-induced).');if(v<100)return rw('Moderate Thrombocytopenia',v+' \u00d710\u2079/L. Monitor closely. Avoid antiplatelets/NSAIDs.');if(v<150)return rl('Mild Thrombocytopenia',v+' \u00d710\u2079/L. Often benign; recheck and review medications.');return rw('Thrombocytosis',v+' \u00d710\u2079/L. Reactive (infection, inflammation, iron deficiency) vs primary (essential thrombocythaemia). Consider JAK2 if persistent.')}},

{id:'bt_coag_panel',n:'Coagulation Panel Interpreter',a:'PT/INR + aPTT Pattern',c:'blood',d:'Differentiates coagulopathy patterns by which pathway (intrinsic/extrinsic/common) is affected.',f:'PT/INR + aPTT \u2192 pathway pattern',
 F:[{i:'inr',l:'INR',p:'e.g. 1.8',u:['ratio'],cv:function(v){return v}},
    {i:'aptt',l:'aPTT',p:'e.g. 55',u:['seconds'],cv:function(v){return v}},
    {i:'aptt_ctrl',l:'aPTT Control (typical 30s)',p:'e.g. 30',u:['seconds'],cv:function(v){return v}}],
 calc:function(v){var apttRatio=(v.aptt/v.aptt_ctrl).toFixed(2);var inrHigh=v.inr>1.2,apttHigh=apttRatio>1.2;return v.inr+','+apttRatio+','+(inrHigh?1:0)+(apttHigh?1:0)},
 ru:'',
 interp:function(r){var p=r.split(',');var inr=+p[0],ar=+p[1],pattern=p[2];
  if(pattern==='00')return rn('Normal Coagulation','INR '+inr+', aPTT ratio '+ar+'. Both within normal limits.');
  if(pattern==='10')return rw('Isolated INR/PT Elevation','INR '+inr+' (high), aPTT ratio '+ar+' (normal). Extrinsic/Factor VII pathway: warfarin, vitamin K deficiency, early liver disease, Factor VII deficiency.');
  if(pattern==='01')return rw('Isolated aPTT Elevation','INR '+inr+' (normal), aPTT ratio '+ar+' (high). Intrinsic pathway: heparin, Factor VIII/IX/XI/XII deficiency (haemophilia), lupus anticoagulant, von Willebrand disease.');
  return rh('Combined INR + aPTT Elevation','INR '+inr+' AND aPTT ratio '+ar+' both elevated. Common pathway: DIC, severe liver disease, Factor I/II/V/X deficiency, supratherapeutic anticoagulation, massive transfusion.')}},

{id:'bt_esr_age',n:'ESR Age-Adjusted Normal',a:'Erythrocyte Sedimentation Rate',c:'blood',d:'Age-adjusted ESR upper limit (Miller formula). Non-specific inflammatory marker.',f:'M: Age\u00f72; F: (Age+10)\u00f72',
 F:[{i:'esr',l:'ESR (measured)',p:'e.g. 35',u:['mm/hr'],cv:function(v){return v}},
    {i:'esr_age',l:'Age',p:'e.g. 60',u:['years'],cv:function(v){return v}}],
 sex:1,
 calc:function(v,s){var uln=s==='F'?(v.esr_age+10)/2:v.esr_age/2;return v.esr.toFixed(0)+','+uln.toFixed(1)},
 ru:'mm/hr',
 interp:function(r){var p=r.split(',');var esr=+p[0],uln=+p[1];if(esr<=uln)return rn('Normal ESR for Age',esr+' mm/hr (age-adjusted ULN: '+uln+').');if(esr<=uln*2)return rw('Mildly Elevated ESR',esr+' mm/hr (ULN '+uln+'). Non-specific. Consider infection, inflammation, malignancy, anaemia.');return rh('Markedly Elevated ESR',esr+' mm/hr (ULN '+uln+'). >100 mm/hr classically associated with temporal arteritis, malignancy, severe infection, or multiple myeloma. Further workup indicated.')}},

{id:'bt_dic_score',n:'DIC Score (ISTH)',a:'Disseminated Intravascular Coagulation',c:'blood',d:'ISTH overt DIC score. \u22655 = compatible with overt DIC. Requires underlying disorder.',f:'Platelets + D-dimer/FDP + PT prolongation + Fibrinogen',
 F:[{i:'dic_plt',l:'Platelets: >100=0, 50-100=1, <50=2 (\u00d710\u2079/L)',p:'0-2',u:['pts'],cv:function(v){return v}},
    {i:'dic_dd',l:'D-dimer/Fibrin markers: No increase=0, Moderate=2, Strong increase=3',p:'0/2/3',u:['pts'],cv:function(v){return v}},
    {i:'dic_pt',l:'PT prolongation: <3s=0, 3-6s=1, >6s=2',p:'0-2',u:['pts'],cv:function(v){return v}},
    {i:'dic_fib',l:'Fibrinogen: >1g/L=0, \u22641g/L=1',p:'0/1',u:['pts'],cv:function(v){return v}}],
 calc:function(v){return Math.round(+v.dic_plt+ +v.dic_dd+ +v.dic_pt+ +v.dic_fib)},
 ru:'points',refs:['<5:Not overt DIC (repeat in 1-2 days)','\u22655:Compatible with overt DIC'],
 interp:function(r){var v=+r;if(v<5)return rw('Not Overt DIC','ISTH score '+v+' \u2014 Suggestive but not confirmatory. Repeat in 24-48h if clinical suspicion persists.');return rh('Overt DIC','ISTH score '+v+' \u2014 Compatible with overt DIC. Treat underlying cause urgently. Supportive care: FFP, platelets, cryoprecipitate as indicated by bleeding/labs.')}},

{id:'bt_smear_rdw',n:'RDW + MCV Combined Pattern',a:'Anaemia Morphology Classifier',c:'blood',d:'RDW (red cell distribution width) combined with MCV narrows differential diagnosis significantly.',f:'MCV category \u00d7 RDW (normal vs high)',
 F:[{i:'rdw_mcv',l:'MCV',p:'e.g. 70',u:['fL'],cv:function(v){return v}},
    {i:'rdw',l:'RDW',p:'e.g. 18',u:['%'],cv:function(v){return v}}],
 calc:function(v){var mcvCat=v.rdw_mcv<80?'micro':v.rdw_mcv<=100?'normo':'macro';var rdwCat=v.rdw>14.5?'high':'normal';return mcvCat+','+rdwCat+','+v.rdw_mcv+','+v.rdw},
 ru:'',
 interp:function(r){var p=r.split(',');var mcvCat=p[0],rdwCat=p[1],mcv=p[2],rdw=p[3];
  var msgs={
   'micro,normal':'Microcytic, normal RDW: Thalassaemia trait, anaemia of chronic disease.',
   'micro,high':'Microcytic, high RDW: Iron deficiency anaemia (classic pattern), mixed deficiency, sideroblastic anaemia.',
   'normo,normal':'Normocytic, normal RDW: Acute blood loss, chronic disease, marrow failure, hereditary spherocytosis.',
   'normo,high':'Normocytic, high RDW: Early iron deficiency, mixed nutritional deficiency, myelofibrosis, sickle cell disease.',
   'macro,normal':'Macrocytic, normal RDW: Aplastic anaemia, some liver disease, myelodysplasia.',
   'macro,high':'Macrocytic, high RDW: B12/folate deficiency (classic pattern), autoimmune haemolytic anaemia, cold agglutinin disease.'
  };
  var key=mcvCat+','+rdwCat;var msg=msgs[key]||'Pattern not classified.';
  var risk=rdwCat==='high'?rw:rn;
  return risk('MCV '+mcv+' fL / RDW '+rdw+'%',msg)}},

{id:'bt_methb',n:'Methaemoglobin / COHb Toxicity',a:'Dyshaemoglobin Panel',c:'blood',d:'MetHb and carboxyhaemoglobin cause functional anaemia despite normal Hgb. Co-oximetry required (pulse ox unreliable).',f:'MetHb% + COHb% \u2192 toxicity grade',
 F:[{i:'methb',l:'Methaemoglobin',p:'e.g. 8',u:['%'],cv:function(v){return v}},
    {i:'cohb',l:'Carboxyhaemoglobin (COHb)',p:'e.g. 5',u:['%'],cv:function(v){return v}}],
 calc:function(v){return v.methb.toFixed(1)+','+v.cohb.toFixed(1)},
 ru:'',
 interp:function(r){var p=r.split(',');var mhb=+p[0],cohb=+p[1]; var msgs=[];
  if(mhb<3)msgs.push('MetHb normal ('+mhb+'%).');else if(mhb<15)msgs.push('MetHb '+mhb+'% \u2014 Mild methaemoglobinaemia; consider causative agent (dapsone, nitrites, local anaesthetics, benzocaine).');else if(mhb<30)msgs.push('MetHb '+mhb+'% \u2014 Moderate; cyanosis common. Consider methylene blue if symptomatic.');else msgs.push('MetHb '+mhb+'% \u2014 Severe, life-threatening. Methylene blue 1-2mg/kg IV. Exchange transfusion if refractory.');
  if(cohb<3)msgs.push('COHb normal ('+cohb+'%, up to 10% in smokers).');else if(cohb<20)msgs.push('COHb '+cohb+'% \u2014 Mild-moderate CO exposure. 100% oxygen.');else if(cohb<40)msgs.push('COHb '+cohb+'% \u2014 Significant exposure. High-flow O2; consider hyperbaric oxygen.');else msgs.push('COHb '+cohb+'% \u2014 Severe, life-threatening CO poisoning. Hyperbaric oxygen indicated.');
  var risk=(mhb>=15||cohb>=20)?rh:(mhb>=3||cohb>=3)?rw:rn;
  return risk('MetHb '+mhb+'% / COHb '+cohb+'%',msgs.join(' '))}}
];

{id:'temp',n:'Temperature',em:'\u{1F321}\uFE0F',col:'#FF8F00',u:['\u00b0C','\u00b0F','K'],conv:function(v,f,t){var c=f=='\u00b0C'?v:f=='\u00b0F'?(v-32)*5/9:v-273.15;return t=='\u00b0C'?c:t=='\u00b0F'?c*9/5+32:c+273.15}},
{id:'weight',n:'Weight / Mass',em:'\u2696\uFE0F',col:'#2E7D32',u:['kg','g','mg','lb','oz','stone'],base:{kg:1,g:1e-3,mg:1e-6,lb:.4536,oz:.02835,stone:6.35},conv:function(v,f,t){return v*this.base[f]/this.base[t]}},
{id:'length',n:'Length / Height',em:'\u{1F4CF}',col:'#1565C0',u:['m','cm','mm','ft','in','miles'],base:{m:1,cm:.01,mm:1e-3,ft:.3048,in:.0254,miles:1609.34},conv:function(v,f,t){return v*this.base[f]/this.base[t]}},
{id:'volume',n:'Volume / Fluid',em:'\u{1F4A7}',col:'#0288D1',u:['L','mL','dL','\u00b5L','fl oz','cups','gallons','pints'],base:{L:1,mL:1e-3,dL:.1,'\u00b5L':1e-6,'fl oz':.02957,cups:.2366,gallons:3.7854,pints:.4732},conv:function(v,f,t){return v*this.base[f]/this.base[t]}},
{id:'pressure',n:'Pressure',em:'\u{1FA7A}',col:'#7B1FA2',u:['mmHg','kPa','Pa','atm','PSI','bar','cmH\u2082O'],base:{mmHg:133.322,kPa:1000,Pa:1,atm:101325,PSI:6894.76,bar:100000,'cmH\u2082O':98.0665},conv:function(v,f,t){return v*this.base[f]/this.base[t]}},
{id:'glucose',n:'Blood Glucose',em:'\u{1FA78}',col:'#880E4F',u:['mg/dL','mmol/L'],conv:function(v,f,t){return f==t?v:f=='mg/dL'?v/18.0182:v*18.0182}},
{id:'creat',n:'Creatinine',em:'\u{1FAD8}',col:'#1565C0',u:['mg/dL','\u00b5mol/L'],conv:function(v,f,t){return f==t?v:f=='mg/dL'?v*88.4:v/88.4}},
{id:'chol',n:'Cholesterol / Lipids',em:'\u2764\uFE0F',col:'#C62828',u:['mg/dL','mmol/L'],conv:function(v,f,t){return f==t?v:f=='mg/dL'?v/38.67:v*38.67}},
{id:'hgb',n:'Hemoglobin',em:'\u{1FA78}',col:'#B71C1C',u:['g/dL','g/L','mmol/L'],base:{'g/dL':10,'g/L':1,'mmol/L':16.11},conv:function(v,f,t){return v*this.base[f]/this.base[t]}},
{id:'bili',n:'Bilirubin',em:'\u{1F7E1}',col:'#F9A825',u:['mg/dL','\u00b5mol/L'],conv:function(v,f,t){return f==t?v:f=='mg/dL'?v*17.1:v/17.1}},
{id:'urea',n:'BUN / Urea',em:'\u{1F9EA}',col:'#2E7D32',u:['mg/dL (BUN)','mmol/L (Urea)'],conv:function(v,f,t){return f==t?v:f=='mg/dL (BUN)'?v/2.8:v*2.8}},
{id:'calcium',n:'Calcium',em:'\u{1F9B4}',col:'#BF360C',u:['mg/dL','mmol/L','mEq/L'],base:{'mg/dL':.2495,'mmol/L':1,'mEq/L':.5},conv:function(v,f,t){return v*this.base[f]/this.base[t]}},
{id:'uricacid',n:'Uric Acid',em:'\u{1F9AB}',col:'#283593',u:['mg/dL','\u00b5mol/L'],conv:function(v,f,t){return f==t?v:f=='mg/dL'?v*59.485:v/59.485}},
{id:'cortisol',n:'Cortisol',em:'\u{1F98B}',col:'#6A1B9A',u:['\u00b5g/dL','nmol/L','ng/mL'],base:{'\u00b5g/dL':27.59,'nmol/L':1,'ng/mL':2.759},conv:function(v,f,t){return v*this.base[f]/this.base[t]}},
{id:'phosphate',n:'Phosphate / Magnesium',em:'\u{1F48A}',col:'#2E7D32',u:['mg/dL','mmol/L','mEq/L'],base:{'mg/dL':.3229,'mmol/L':1,'mEq/L':.5},conv:function(v,f,t){return v*this.base[f]/this.base[t]}},
{id:'enzyme',n:'Enzyme Activity',em:'\u2697\uFE0F',col:'#E65100',u:['U/L','IU/L','\u00b5kat/L','nkat/L'],base:{'U/L':1,'IU/L':1,'\u00b5kat/L':60,'nkat/L':.06},conv:function(v,f,t){return v*this.base[f]/this.base[t]}},
{id:'hba1c_conv',n:'HbA1c Units',em:'\u{1F9EC}',col:'#880E4F',u:['% (DCCT)','mmol/mol (IFCC)'],conv:function(v,f,t){return f==t?v:f=='% (DCCT)'?+(10.929*(v-2.15)).toFixed(1):+((v/10.929)+2.15).toFixed(2)}},
{id:'vitd',n:'Vitamin D',em:'\u2600\uFE0F',col:'#F9A825',u:['ng/mL','nmol/L'],conv:function(v,f,t){return f==t?v:f=='ng/mL'?v*2.496:v/2.496}},
{id:'troponin',n:'Troponin',em:'\u2764\uFE0F',col:'#880E4F',u:['ng/L','pg/mL','ng/mL'],base:{'ng/L':1,'pg/mL':1,'ng/mL':1000},conv:function(v,f,t){return v*this.base[f]/this.base[t]}},
{id:'crp',n:'CRP / Inflammation',em:'\u{1F321}\uFE0F',col:'#C62828',u:['mg/L','mg/dL','\u00b5g/mL'],base:{'mg/L':1,'mg/dL':10,'\u00b5g/mL':1},conv:function(v,f,t){return v*this.base[f]/this.base[t]}},
{id:'insulin_conv',n:'Insulin',em:'\u{1F489}',col:'#6A1B9A',u:['\u00b5IU/mL','mIU/L','pmol/L'],base:{'\u00b5IU/mL':1,'mIU/L':1,'pmol/L':.1439},conv:function(v,f,t){return v*this.base[f]/this.base[t]}},
{id:'ferritin',n:'Ferritin / Iron',em:'\u{1FA78}',col:'#C62828',u:['ng/mL','\u00b5g/L','pmol/L'],base:{'ng/mL':1,'\u00b5g/L':1,'pmol/L':.0447},conv:function(v,f,t){return v*this.base[f]/this.base[t]}},
{id:'flow',n:'IV Flow Rate',em:'\u{1F4A7}',col:'#3949AB',u:['mL/hr','mL/min','L/hr'],base:{'mL/hr':1,'mL/min':60,'L/hr':1000},conv:function(v,f,t){return v*this.base[f]/this.base[t]}},

// STATE
var cat='all',activeMed=null,activeConv=null,SX={};

function switchTab(id){
  ['med','conv'].forEach(function(x){
    document.getElementById('t-'+x).className='tab'+(x===id?' on':'');
    document.getElementById('p-'+x).className='panel'+(x===id?' on':'');
  });
}

function setCat(c,el){
  cat=c;
  document.querySelectorAll('#chips .chip').forEach(function(x){x.className='chip'});
  el.className='chip on';
  renderMed();
}

function renderMed(){
  var q=document.getElementById('med-q').value.toLowerCase();
  var list=T.filter(function(t){return(cat==='all'||t.c===cat)&&(t.n.toLowerCase().indexOf(q)>-1||t.a.toLowerCase().indexOf(q)>-1)});
  var el=document.getElementById('med-list');
  if(!list.length){el.innerHTML='<div class="empty">No tests found.</div>';return}
  el.innerHTML=list.map(function(t){
    var cc=CCAT[t.c]||{em:'',bg:'#E3F2FD',fg:'#1565C0'};
    return '<div class="li'+(t.id===activeMed?' on':'')+'" onclick="openTest(\''+t.id+'\')">'
      +'<div class="ico" style="background:'+cc.bg+';color:'+cc.fg+'">'+cc.em+'</div>'
      +'<div class="li-info"><div class="li-name">'+t.n+'</div><div class="li-sub">'+t.a+'</div></div>'
      +'<div class="li-arr">&#8250;</div></div>';
  }).join('');
}

function renderConv(){
  var q=document.getElementById('conv-q').value.toLowerCase();
  var list=CV.filter(function(c){return c.n.toLowerCase().indexOf(q)>-1});
  var el=document.getElementById('conv-list');
  if(!list.length){el.innerHTML='<div class="empty">No converters found.</div>';return}
  el.innerHTML=list.map(function(c){
    return '<div class="li'+(c.id===activeConv?' on':'')+'" onclick="openConv(\''+c.id+'\')">'
      +'<div class="ico" style="background:'+c.col+'22;color:'+c.col+'">'+c.em+'</div>'
      +'<div class="li-info"><div class="li-name">'+c.n+'</div>'
      +'<div class="li-sub">'+(c.u?c.u.slice(0,3).join(' \u00b7 ')+(c.u.length>3?'\u2026':''):'')+'</div></div>'
      +'<div class="li-arr">&#8250;</div></div>';
  }).join('');
}

function openTest(id){
  activeMed=id; renderMed();
  var t=T.filter(function(x){return x.id===id})[0];
  var cc=CCAT[t.c]||{em:'',bg:'#E3F2FD',fg:'#1565C0',gr:'linear-gradient(135deg,#1565C0,#1976D2)'};
  if(!SX[id]) SX[id]='M';
  var card=document.getElementById('med-calc');
  card.style.display='block';
  var sxH=t.sex
    ?'<div class="fld"><label class="fld-lbl">Biological Sex</label><div class="sex-row">'
     +'<div class="sx on" id="sx-M-'+id+'" onclick="pickSex(\''+id+'\',\'M\')">&#9794; Male</div>'
     +'<div class="sx" id="sx-F-'+id+'" onclick="pickSex(\''+id+'\',\'F\')">&#9792; Female</div>'
     +'</div></div>':'';
  var fH=t.F.map(function(f){
    var multi=f.u&&f.u.length>1;
    var uCtrl=multi
      ?'<select class="usel" id="u-'+id+'-'+f.i+'">'
        +f.u.map(function(u,k){return'<option value="'+u+'"'+(k===0?' selected':'')+'>'+u+'</option>'}).join('')
        +'</select>'
      :'<div class="ubadge">'+f.u[0]+'</div>';
    return '<div class="fld"><label class="fld-lbl">'+f.l+'</label>'
      +'<div class="fld-row" id="fr-'+id+'-'+f.i+'">'
      +'<input class="inp" type="number" id="f-'+id+'-'+f.i+'" placeholder="'+f.p+'" step="any" '
      +'oninput="document.getElementById(\'fr-'+id+'-'+f.i+'\').classList.remove(\'err\')">'
      +uCtrl+'</div></div>';
  }).join('');
  card.innerHTML=
    '<div class="cc-head" style="background:'+cc.gr+'">'
    +'<button class="cc-close" onclick="closeCalc()">\u00d7</button>'
    +'<div class="cc-row"><div class="cc-ico">'+cc.em+'</div>'
    +'<div><div class="cc-name">'+t.n+'</div><div class="cc-abbr">'+t.a+'</div></div></div>'
    +'<div class="cc-desc">'+t.d+'</div>'
    +'<div class="cc-fml">&#402; '+t.f+'</div></div>'
    +'<div class="cc-body">'+sxH+fH
    +'<div class="btns">'
    +'<button class="btn btn-p" onclick="doCalc(\''+id+'\')">&#9654; Calculate</button>'
    +'<button class="btn btn-s" onclick="clearCalc(\''+id+'\')">Clear</button>'
    +'</div>'
    +'<div id="res-'+id+'" class="res"></div></div>';
  card.scrollIntoView({behavior:'smooth',block:'start'});
}

function pickSex(id,s){
  SX[id]=s;
  ['M','F'].forEach(function(x){
    var el=document.getElementById('sx-'+x+'-'+id);
    if(el) el.className='sx'+(s===x?' on':'');
  });
}

function doCalc(id){
  var t=T.filter(function(x){return x.id===id})[0];
  var vals={};var ok=true;
  for(var i=0;i<t.F.length;i++){
    var f=t.F[i];
    var el=document.getElementById('f-'+id+'-'+f.i);
    var fr=document.getElementById('fr-'+id+'-'+f.i);
    if(fr) fr.classList.remove('err');
    if(el.value===''||isNaN(+el.value)){if(fr)fr.classList.add('err');el.focus();ok=false;break}
    var uSel=document.getElementById('u-'+id+'-'+f.i);
    vals[f.i]=f.cv(+el.value,uSel?uSel.value:f.u[0]);
  }
  if(!ok) return;
  var s=SX[id]||'M';
  var result=t.sex?t.calc(vals,s):t.calc(vals);
  var interp=t.rawCalc?t.interp(String(result),vals):(t.sex?t.interp(String(result),s):t.interp(String(result)));
  var box=document.getElementById('res-'+id);
  // Result unit selector
  var ruSel='';
  var rawNum=parseFloat(result);
  if(t.ruU&&t.ruU.length>1&&!isNaN(rawNum)){
    ruSel='<div class="res-ru"><span class="res-ru-lbl">Result Unit</span>'
      +'<select class="res-ru-sel" id="ruu-'+id+'" onchange="convertRU(\''+id+'\')">'
      +t.ruU.map(function(u,k){return'<option value="'+k+'">'+u+'</option>'}).join('')
      +'</select></div>';
  }
  box.className='res show '+interp.cls;
  var refsBlock=(t.refs&&t.refs.length)?('<div class="res-refs"><div class="refs-lbl">Reference Ranges</div>'
    +'<div class="ref-tags">'+t.refs.map(function(r){return'<span class="rtag">'+r+'</span>'}).join('')+'</div></div>'):'';
  box.innerHTML='<div class="res-hd">'+interp.st+'</div>'
    +'<div class="res-val"><span class="res-n" id="rn-'+id+'">'+result+'</span>'
    +'<span class="res-u" id="ru-'+id+'">'+t.ru+'</span></div>'
    +'<div class="res-txt">'+interp.txt+'</div>'
    +ruSel
    +refsBlock;
  box._raw=rawNum;
  box.scrollIntoView({behavior:'smooth',block:'nearest'});
}

function convertRU(id){
  var t=T.filter(function(x){return x.id===id})[0];
  if(!t||!t.ruU||!t.ruF) return;
  var sel=document.getElementById('ruu-'+id);
  if(!sel) return;
  var idx=+sel.value;
  var box=document.getElementById('res-'+id);
  if(!box||isNaN(box._raw)) return;
  var converted=t.ruF(box._raw,idx);
  var fmt=Math.abs(converted)<0.0001&&converted!==0?converted.toExponential(3):parseFloat(converted.toFixed(4)).toString();
  var rnEl=document.getElementById('rn-'+id);
  var ruEl=document.getElementById('ru-'+id);
  if(rnEl) rnEl.textContent=fmt;
  if(ruEl) ruEl.textContent=t.ruU[idx];
}

function clearCalc(id){
  var t=T.filter(function(x){return x.id===id})[0];
  t.F.forEach(function(f){
    var e=document.getElementById('f-'+id+'-'+f.i);
    var fr=document.getElementById('fr-'+id+'-'+f.i);
    if(e){e.value='';if(fr)fr.classList.remove('err')}
  });
  var b=document.getElementById('res-'+id);if(b)b.className='res';
}

function closeCalc(){
  document.getElementById('med-calc').style.display='none';
  activeMed=null; renderMed();
}

function openConv(id){
  activeConv=id; renderConv();
  var c=CV.filter(function(x){return x.id===id})[0];
  var card=document.getElementById('conv-calc');
  card.style.display='block';
  if(!c.conv){
    if(id==='dose_calc') card.innerHTML=buildDose(c.col);
    else if(id==='iv_calc') card.innerHTML=buildIV(c.col);
    else card.innerHTML=buildBMI(c.col);
    card.scrollIntoView({behavior:'smooth',block:'start'});
    return;
  }
  var o0=c.u.map(function(u,i){return'<option value="'+u+'"'+(i===0?' selected':'')+'>'+u+'</option>'}).join('');
  var o1=c.u.map(function(u,i){return'<option value="'+u+'"'+(i===1?' selected':'')+'>'+u+'</option>'}).join('');
  card.innerHTML=
    '<div class="cv-hd" style="background:linear-gradient(135deg,'+c.col+','+c.col+'cc);color:#fff">'
    +'<button class="cc-close" onclick="closeConv()">\u00d7</button>'
    +'<div style="font-size:22px;margin-bottom:4px">'+c.em+'</div>'
    +'<div style="font-size:16px;font-weight:700;padding-right:36px">'+c.n+'</div>'
    +'<div style="font-size:11px;opacity:.8;margin-top:2px">'+c.u.length+' units available</div></div>'
    +'<div class="cc-body">'
    +'<div class="fld"><label class="fld-lbl">From</label>'
    +'<div class="fld-row"><input class="inp" type="number" id="cv-in-'+id+'" placeholder="Enter value" step="any" oninput="doConv(\''+id+'\')">'
    +'<select class="usel" id="cv-from-'+id+'" onchange="doConv(\''+id+'\')">'+o0+'</select></div></div>'
    +'<button class="cv-swap" onclick="swapConv(\''+id+'\')">&#8645;</button>'
    +'<div class="fld"><label class="fld-lbl">To</label>'
    +'<div class="fld-row"><input class="inp" type="number" id="cv-out-'+id+'" placeholder="Result" readonly>'
    +'<select class="usel" id="cv-to-'+id+'" onchange="doConv(\''+id+'\')">'+o1+'</select></div></div>'
    +'<div class="cv-out" id="cv-res-'+id+'">Enter a value above to convert</div>'
    +'</div>';
  card.scrollIntoView({behavior:'smooth',block:'start'});
}

function doConv(id){
  var c=CV.filter(function(x){return x.id===id})[0];
  var inp=document.getElementById('cv-in-'+id);
  var val=+inp.value,frm=document.getElementById('cv-from-'+id).value,to=document.getElementById('cv-to-'+id).value;
  var out=document.getElementById('cv-out-'+id),res=document.getElementById('cv-res-'+id);
  if(inp.value===''||isNaN(val)){out.value='';res.textContent='Enter a value above to convert';return}
  var r=c.conv(val,frm,to);
  var fmt=Math.abs(r)<1e-7&&r!==0?r.toExponential(4):parseFloat(r.toFixed(8)).toString();
  out.value=fmt;
  res.textContent=val+' '+frm+' = '+fmt+' '+to;
}

function swapConv(id){
  var f=document.getElementById('cv-from-'+id),t=document.getElementById('cv-to-'+id);
  var tmp=f.value;f.value=t.value;t.value=tmp;
  var i=document.getElementById('cv-in-'+id),o=document.getElementById('cv-out-'+id);
  if(o.value&&o.value!='') i.value=o.value;
  doConv(id);
}

function closeConv(){
  document.getElementById('conv-calc').style.display='none';
  activeConv=null; renderConv();
}

var bmiSex='M';
function buildDose(col){
  return '<div class="cv-hd" style="background:linear-gradient(135deg,'+col+','+col+'cc);color:#fff">'
    +'<button class="cc-close" onclick="closeConv()">\u00d7</button>'
    +'<div style="font-size:22px;margin-bottom:4px">\u{1F48A}</div>'
    +'<div style="font-size:16px;font-weight:700">Drug Dose Calculator</div>'
    +'<div style="font-size:11px;opacity:.8;margin-top:2px">Weight-based dosing</div></div>'
    +'<div class="cc-body">'
    +'<div class="fld"><label class="fld-lbl">Drug Name (optional)</label>'
    +'<input type="text" id="dd-drug" placeholder="e.g. Amoxicillin" style="width:100%;border:1.5px solid #DDE3EA;border-radius:9px;padding:10px 12px;font-size:14px;font-family:inherit;outline:none;color:#333"></div>'
    +'<div class="fld"><label class="fld-lbl">Dose per kg</label>'
    +'<div class="fld-row"><input class="inp" type="number" id="dd-dose" placeholder="e.g. 15" step="any">'
    +'<select class="usel" id="dd-du"><option>mg/kg</option><option>\u00b5g/kg</option><option>g/kg</option></select></div></div>'
    +'<div class="fld"><label class="fld-lbl">Patient Weight</label>'
    +'<div class="fld-row"><input class="inp" type="number" id="dd-wt" placeholder="e.g. 70" step="any">'
    +'<select class="usel" id="dd-wu"><option value="kg">kg</option><option value="lb">lb</option></select></div></div>'
    +'<div class="fld"><label class="fld-lbl">Doses per day</label>'
    +'<div class="fld-row"><input class="inp" type="number" id="dd-freq" placeholder="e.g. 3" step="1">'
    +'<div class="ubadge">x/day</div></div></div>'
    +'<div class="btns"><button class="btn btn-p" onclick="calcDose()">&#9654; Calculate</button>'
    +'<button class="btn btn-s" onclick="clrDose()">Clear</button></div>'
    +'<div id="dd-res"></div></div>';
}
function calcDose(){
  var drug=document.getElementById('dd-drug').value||'Drug';
  var d=+document.getElementById('dd-dose').value,du=document.getElementById('dd-du').value;
  var w=+document.getElementById('dd-wt').value,wu=document.getElementById('dd-wu').value;
  var freq=+document.getElementById('dd-freq').value||1;
  var box=document.getElementById('dd-res');
  if(!d||!w){box.innerHTML='<div style="color:#E65100;padding:10px;font-size:13px">Enter dose and weight.</div>';return}
  var wt=wu==='lb'?w*.4536:w;
  var mg=du==='\u00b5g/kg'?d*wt/1000:du==='g/kg'?d*wt*1000:d*wt;
  var per=mg/freq;
  box.className='res show ri';
  box.innerHTML='<div class="res-hd">'+drug+' Dose</div>'
    +'<div class="res-val"><span class="res-n">'+per.toFixed(1)+'</span><span class="res-u">mg / dose</span></div>'
    +'<div class="res-txt">Weight: <b>'+wt.toFixed(1)+' kg</b> | Dose: <b>'+d+' '+du+'</b> | Frequency: <b>'+freq+'x/day</b><br>'
    +'Total daily: <b>'+mg.toFixed(1)+' mg</b> | Per dose: <b>'+per.toFixed(1)+' mg</b> every '+(24/freq).toFixed(0)+'h</div>';
}
function clrDose(){['dd-drug','dd-dose','dd-wt','dd-freq'].forEach(function(i){var e=document.getElementById(i);if(e)e.value=''});var b=document.getElementById('dd-res');if(b){b.className='';b.innerHTML=''}}

function buildIV(col){
  return '<div class="cv-hd" style="background:linear-gradient(135deg,'+col+','+col+'cc);color:#fff">'
    +'<button class="cc-close" onclick="closeConv()">\u00d7</button>'
    +'<div style="font-size:22px;margin-bottom:4px">\u{1F3E5}</div>'
    +'<div style="font-size:16px;font-weight:700">IV Drip Rate Calculator</div>'
    +'<div style="font-size:11px;opacity:.8;margin-top:2px">Infusion rate and drop rate</div></div>'
    +'<div class="cc-body">'
    +'<div class="fld"><label class="fld-lbl">Volume to Infuse</label>'
    +'<div class="fld-row"><input class="inp" type="number" id="iv-vol" placeholder="e.g. 500" step="any">'
    +'<select class="usel" id="iv-vu"><option value="1">mL</option><option value="1000">L</option></select></div></div>'
    +'<div class="fld"><label class="fld-lbl">Infusion Duration</label>'
    +'<div class="fld-row"><input class="inp" type="number" id="iv-time" placeholder="e.g. 4" step="any">'
    +'<select class="usel" id="iv-tu"><option value="60">hours</option><option value="1">minutes</option></select></div></div>'
    +'<div class="fld"><label class="fld-lbl">Drop Factor</label>'
    +'<div class="fld-row"><input class="inp" type="number" id="iv-gtts" placeholder="e.g. 20" step="1">'
    +'<div class="ubadge">gtts/mL</div></div></div>'
    +'<div class="btns"><button class="btn btn-p" onclick="calcIV()">&#9654; Calculate</button>'
    +'<button class="btn btn-s" onclick="clrIV()">Clear</button></div>'
    +'<div id="iv-res"></div></div>';
}
function calcIV(){
  var vol=+document.getElementById('iv-vol').value * +document.getElementById('iv-vu').value;
  var mins=+document.getElementById('iv-time').value * +document.getElementById('iv-tu').value;
  var gtts=+document.getElementById('iv-gtts').value;
  var box=document.getElementById('iv-res');
  if(!vol||!mins||!gtts){box.innerHTML='<div style="color:#E65100;padding:10px;font-size:13px">Fill all fields.</div>';return}
  var mlhr=(vol/mins)*60,gm=(vol*gtts)/mins;
  box.className='res show ri';
  box.innerHTML='<div class="res-hd">IV Infusion Rate</div>'
    +'<div class="res-val"><span class="res-n">'+mlhr.toFixed(1)+'</span><span class="res-u">mL/hr</span></div>'
    +'<div class="res-txt">Drop rate: <b>'+gm.toFixed(0)+' gtts/min</b><br>Volume: <b>'+vol.toFixed(0)+' mL</b> | Drop factor: <b>'+gtts+' gtts/mL</b></div>';
}
function clrIV(){['iv-vol','iv-time','iv-gtts'].forEach(function(i){var e=document.getElementById(i);if(e)e.value=''});var b=document.getElementById('iv-res');if(b){b.className='';b.innerHTML=''}}

function buildBMI(col){
  return '<div class="cv-hd" style="background:linear-gradient(135deg,'+col+','+col+'cc);color:#fff">'
    +'<button class="cc-close" onclick="closeConv()">\u00d7</button>'
    +'<div style="font-size:22px;margin-bottom:4px">\u{1F464}</div>'
    +'<div style="font-size:16px;font-weight:700">BMI + IBW + BSA</div>'
    +'<div style="font-size:11px;opacity:.8;margin-top:2px">Body composition calculator</div></div>'
    +'<div class="cc-body">'
    +'<div class="fld"><label class="fld-lbl">Weight</label>'
    +'<div class="fld-row"><input class="inp" type="number" id="bmi-wt" placeholder="e.g. 70" step="any">'
    +'<select class="usel" id="bmi-wu"><option value="kg">kg</option><option value="lb">lb</option></select></div></div>'
    +'<div class="fld"><label class="fld-lbl">Height</label>'
    +'<div class="fld-row"><input class="inp" type="number" id="bmi-ht" placeholder="e.g. 170" step="any">'
    +'<select class="usel" id="bmi-hu"><option value="cm">cm</option><option value="in">in</option><option value="ft">ft</option></select></div></div>'
    +'<div class="sex-row"><div class="sx on" id="bmiM" onclick="bmiSex=\'M\';document.getElementById(\'bmiM\').className=\'sx on\';document.getElementById(\'bmiF\').className=\'sx\'">&#9794; Male</div>'
    +'<div class="sx" id="bmiF" onclick="bmiSex=\'F\';document.getElementById(\'bmiF\').className=\'sx on\';document.getElementById(\'bmiM\').className=\'sx\'">&#9792; Female</div></div>'
    +'<div class="btns"><button class="btn btn-p" onclick="calcBMI()">&#9654; Calculate</button>'
    +'<button class="btn btn-s" onclick="clrBMI()">Clear</button></div>'
    +'<div id="bmi-res"></div></div>';
}
function calcBMI(){
  var wr=+document.getElementById('bmi-wt').value,wu=document.getElementById('bmi-wu').value;
  var hr=+document.getElementById('bmi-ht').value,hu=document.getElementById('bmi-hu').value;
  var box=document.getElementById('bmi-res');
  if(!wr||!hr){box.innerHTML='<div style="color:#E65100;padding:10px;font-size:13px">Enter weight and height.</div>';return}
  var wt=wu==='lb'?wr*.4536:wr;
  var ht=hu==='in'?hr*2.54:hu==='ft'?hr*30.48:hr;
  var bmi=(wt/Math.pow(ht/100,2)).toFixed(1);
  var hin=ht/2.54,ibw=Math.max(0,(bmiSex==='M'?50:45.5)+2.3*(hin-60)).toFixed(1);
  var bsa=Math.sqrt((ht*wt)/3600).toFixed(2);
  var adj=wt>+ibw?(+ibw+0.4*(wt-+ibw)).toFixed(1):null;
  var cat2=+bmi<18.5?'Underweight':+bmi<25?'Normal Weight':+bmi<30?'Overweight':+bmi<35?'Obese I':+bmi<40?'Obese II':'Obese III';
  var cls=+bmi<18.5?'rl':+bmi<25?'rn':+bmi<30?'rw':'rh';
  box.className='res show '+cls;
  box.innerHTML='<div class="res-hd">'+cat2+'</div>'
    +'<div class="res-val"><span class="res-n">'+bmi+'</span><span class="res-u">kg/m\u00b2</span></div>'
    +'<div class="res-txt"><b>IBW (Devine):</b> '+ibw+' kg<br><b>BSA (Mosteller):</b> '+bsa+' m\u00b2<br>'
    +(adj?'<b>Adjusted BW:</b> '+adj+' kg<br>':'')
    +'Weight: <b>'+wt.toFixed(1)+' kg</b> | Height: <b>'+ht.toFixed(0)+' cm</b></div>';
}
function clrBMI(){['bmi-wt','bmi-ht'].forEach(function(i){var e=document.getElementById(i);if(e)e.value=''});var b=document.getElementById('bmi-res');if(b){b.className='';b.innerHTML=''}}

renderMed();
renderConv();
</script>
