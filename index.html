{id:'phenylke',n:'Phenylketonuria Diet Phe Load',a:'PKU Phenylalanine Tolerance',c:'meta',
 d:'Estimates daily phenylalanine tolerance for PKU dietary management. Values are approximate; individual titration required.',
 f:'Estimated tolerance based on age/classic PKU',
 F:[{i:'pku_age',l:'Age',p:'e.g. 5',u:['years','months'],cv:function(v,u){return u==='months'?+(v/12).toFixed(2):+v}},
    {i:'pku_phe',l:'Current daily Phe intake',p:'e.g. 300',u:['mg/day'],cv:function(v){return +v}},
    {i:'pku_blood',l:'Recent blood Phe level',p:'e.g. 350',u:['µmol/L'],cv:function(v){return +v}}],
 calc:function(v){
  var target=v.pku_age<1?60:v.pku_age<4?150:v.pku_age<10?250:v.pku_age<16?350:400;
  return v.pku_phe+','+v.pku_blood+','+target;
 },
 ru:'mg Phe/day',
 refs:['Target blood Phe: <360 µmol/L (UK), <120 (strict)','<4yr:120-360 µmol/L target','≥16yr:<600 µmol/L (general guidance)'],
 interp:function(r){var p=r.split(',');var phe=+p[0],blood=+p[1],target=+p[2];
  var ctrl=blood<120?'Excellent':blood<360?'Acceptable':blood<600?'Above target':'Poorly controlled';
  var fn=blood<360?rn:blood<600?rw:rh;
  return fn('Blood Phe '+blood+' µmol/L — '+ctrl,'Current intake '+phe+' mg/day. Estimated age-appropriate tolerance ~'+target+' mg/day. Adjust based on blood levels. Specialist metabolic team guidance essential.')}},

{id:'apacheii_simple',n:'APACHE II (Simplified)',a:'ICU Severity Score',c:'infect',
 d:'APACHE II predicts ICU mortality. Full score requires 12 physiological variables. Enter pre-calculated physiology score + age + chronic health.',
 f:'Physiology score + Age points + Chronic health points',
 F:[{i:'ap_phys',l:'Acute Physiology Score (sum of 12 APS variables, 0-60)',p:'e.g. 12',u:['pts'],cv:function(v){return +v}},
    {i:'ap_age',l:'Age points: <44=0, 45-54=2, 55-64=3, 65-74=5, ≥75=6',p:'0-6',u:['pts'],cv:function(v){return +v}},
    {i:'ap_ch',l:'Chronic health: None=0, Elective post-op=2, Emergency/non-op=5',p:'0/2/5',u:['pts'],cv:function(v){return +v}}],
 calc:function(v){return Math.round(+v.ap_phys+ +v.ap_age+ +v.ap_ch)},
 ru:'points',
 refs:['0-9:~4% ICU mortality','10-19:~15%','20-29:~25%','30-34:~40%','≥35:~70-85%'],
 interp:function(r){var v=+r;
  var mort=v<=9?'~4%':v<=19?'~15%':v<=29?'~25%':v<=34?'~40%':'~70-85%';
  var fn=v<=9?rn:v<=19?rw:rh;
  return fn('APACHE II '+v+' — Predicted ICU Mortality '+mort,'Score '+v+'. Predicted ICU mortality '+mort+'. Use for cohort comparison and prognostication, not individual treatment decisions.')}},

{id:'six_min_walk',n:'6-Minute Walk Test (% Predicted)',a:'6MWT Reference Percentage',c:'resp',
 d:'Compares achieved 6MWT distance to predicted value based on age, sex, height and weight. <80% predicted is abnormal.',
 f:'Predicted 6MWT (m) varies by sex. % = Achieved/Predicted × 100',
 F:[{i:'smw_dist',l:'Achieved 6MWT distance',p:'e.g. 420',u:['metres'],cv:function(v){return +v}},
    {i:'smw_age',l:'Age',p:'e.g. 65',u:['years'],cv:function(v){return +v}},
    {i:'smw_ht',l:'Height',p:'e.g. 170',u:['cm','in'],cv:function(v,u){return UC.ht(v,u)}},
    {i:'smw_wt',l:'Weight',p:'e.g. 70',u:['kg','lb'],cv:function(v,u){return UC.wt(v,u)}}],
 sex:1,
 calc:function(v,s){
  var pred=s==='M'?
    7.57*v.smw_ht-5.02*v.smw_age-1.76*v.smw_wt-309:
    2.11*v.smw_ht-2.29*v.smw_wt-5.78*v.smw_age+667;
  pred=Math.max(100,pred);
  var pct=(v.smw_dist/pred*100).toFixed(0);
  return pct+','+Math.round(pred);
 },
 ru:'% predicted',
 refs:['Normal:≥80% predicted','Mildly reduced:60-79%','Moderately reduced:40-59%','Severely reduced:<40%'],
 interp:function(r){var p=r.split(',');var pct=+p[0],pred=+p[1];
  if(pct>=80)return rn('Normal Exercise Capacity',pct+'% of predicted '+pred+' m. Functional capacity preserved.');
  if(pct>=60)return rw('Mildly Reduced',pct+'% of predicted '+pred+' m. Pulmonary rehabilitation assessment. Optimise medical therapy.');
  if(pct>=40)return rh('Moderately Reduced',pct+'% of predicted '+pred+' m. Significant functional impairment. Cardiopulmonary evaluation. Rehab referral.');
  return rh('Severely Reduced',pct+'% of predicted '+pred+' m. Severe functional limitation. Transplant evaluation if appropriate. Palliative care discussion.')}},

{id:'ecog_ps',n:'ECOG Performance Status',a:'Eastern Cooperative Oncology Group',c:'meta',
 d:'ECOG PS grades functional status in oncology patients. Used to guide chemotherapy eligibility and prognosis.',
 f:'Graded 0-5 based on self-care ability and activity level',
 F:[{i:'ecog',l:'Grade: 0=Fully active, 1=Restricted vigorous, 2=Ambulatory >50% day, 3=Limited self-care, 4=Fully disabled, 5=Dead',p:'0-5',u:['grade'],cv:function(v){return Math.round(+v)}}],
 calc:function(v){return v.ecog},
 ru:'ECOG grade',
 refs:['0:Fully active','1:Restricted but ambulatory','2:Ambulatory, light work only','3:Limited self-care','4:Completely disabled','5:Dead'],
 interp:function(r){var v=+r;var msgs=['Fully active. No restriction. Standard chemotherapy regimens appropriate.','Restricted in strenuous activity but ambulatory. Light sedentary work. Standard chemotherapy generally appropriate.','Ambulatory and capable of self-care. Unable to work. Up and about >50% waking hours. Consider dose modifications.','Capable of limited self-care. Confined to bed/chair >50% waking hours. Reduced-intensity or palliative intent treatment.','Completely disabled. Cannot carry on self-care. Totally confined. Best supportive care consideration.','Dead.'];var fn=[rn,rn,rw,rw,rh,rh];return(fn[v]||ri)('ECOG PS '+v,msgs[v]||'')}},

{id:'heart_score',n:'HEART Score',a:'Chest Pain Risk Stratification',c:'cardiac',d:'Estimates 6-week risk of major adverse cardiac events in ED chest pain patients.',f:'History+ECG+Age+Risk factors+Troponin (each 0-2)',
 F:[{i:'h_hist',l:'History: 0=Slightly suspicious, 1=Moderately suspicious, 2=Highly suspicious',p:'0-2',u:['pts'],cv:function(v){return v}},
    {i:'h_ecg',l:'ECG: 0=Normal, 1=Non-specific repolarisation, 2=Significant ST deviation',p:'0-2',u:['pts'],cv:function(v){return v}},
    {i:'h_age',l:'Age: 0=<45, 1=45-64, 2=≥65',p:'0-2',u:['pts'],cv:function(v){return v}},
    {i:'h_risk',l:'Risk factors: 0=None, 1=1-2 factors, 2=≥3 factors or known atherosclerotic disease',p:'0-2',u:['pts'],cv:function(v){return v}},
    {i:'h_trop',l:'Troponin: 0=≤normal limit, 1=1-3× normal, 2=>3× normal',p:'0-2',u:['pts'],cv:function(v){return v}}],
 calc:function(v){return Math.round(+v.h_hist+ +v.h_ecg+ +v.h_age+ +v.h_risk+ +v.h_trop)},
 ru:'points',refs:['0-3:Low risk (~0.9-1.7% MACE)','4-6:Moderate risk (~12-16.6% MACE)','7-10:High risk (~50-65% MACE)'],
 interp:function(r){var v=+r;if(v<=3)return rn('Low Risk','HEART '+v+' — ~0.9-1.7% 6-week MACE risk. Consider early discharge with outpatient follow-up.');if(v<=6)return rw('Moderate Risk','HEART '+v+' — ~12-16.6% 6-week MACE risk. Admit for observation, serial troponins, and further work-up.');return rh('High Risk','HEART '+v+' — ~50-65% 6-week MACE risk. Admit; consider early cardiology and invasive strategy.')}},

{id:'perc_rule',n:'PERC Rule',a:'PE Rule-Out Criteria',c:'resp',d:'Rules out PE in low pre-test probability patients without further testing if all 8 criteria are negative.',f:'8 criteria; all negative = PE excluded',
 F:[{i:'p_age',l:'Age ≥50 (1=Yes)',p:'0/1',u:['pts'],cv:function(v){return v}},
    {i:'p_hr',l:'HR ≥100 bpm (1=Yes)',p:'0/1',u:['pts'],cv:function(v){return v}},
    {i:'p_o2',l:'O₂ saturation <95% on room air (1=Yes)',p:'0/1',u:['pts'],cv:function(v){return v}},
    {i:'p_leg',l:'Unilateral leg swelling (1=Yes)',p:'0/1',u:['pts'],cv:function(v){return v}},
    {i:'p_hemo',l:'Haemoptysis (1=Yes)',p:'0/1',u:['pts'],cv:function(v){return v}},
    {i:'p_surg',l:'Recent surgery or trauma (≤4 weeks) (1=Yes)',p:'0/1',u:['pts'],cv:function(v){return v}},
    {i:'p_prior',l:'Prior PE or DVT (1=Yes)',p:'0/1',u:['pts'],cv:function(v){return v}},
    {i:'p_horm',l:'Hormone use (oral contraceptive, HRT, oestrogen) (1=Yes)',p:'0/1',u:['pts'],cv:function(v){return v}}],
 calc:function(v){return Math.round(+v.p_age+ +v.p_hr+ +v.p_o2+ +v.p_leg+ +v.p_hemo+ +v.p_surg+ +v.p_prior+ +v.p_horm)},
 ru:'criteria positive',refs:['0:PE ruled out (in low pre-test probability)','≥1:PERC not met — further work-up needed'],

{id:'geneva_score',n:'Revised Geneva Score',a:'PE Clinical Probability',c:'resp',d:'Clinical probability of PE using only objective criteria, without requiring clinical gestalt.',f:'Age+Prior PE/DVT+Surgery/fracture+Malignancy+Leg pain+Haemoptysis+HR+Leg swelling/pain on palpation',
 F:[{i:'g_age',l:'Age >65 (1=Yes)',p:'0/1',u:['pts'],cv:function(v){return v}},
    {i:'g_prior',l:'Previous PE or DVT (3=Yes)',p:'0/3',u:['pts'],cv:function(v){return v}},
    {i:'g_surg',l:'Surgery or fracture within 1 month (2=Yes)',p:'0/2',u:['pts'],cv:function(v){return v}},
    {i:'g_malig',l:'Active malignancy (2=Yes)',p:'0/2',u:['pts'],cv:function(v){return v}},
    {i:'g_leg',l:'Unilateral lower limb pain (3=Yes)',p:'0/3',u:['pts'],cv:function(v){return v}},
    {i:'g_hemo',l:'Haemoptysis (2=Yes)',p:'0/2',u:['pts'],cv:function(v){return v}},
    {i:'g_hr',l:'Heart rate: 0=<75, 3=75-94, 5=≥95',p:'0/3/5',u:['pts'],cv:function(v){return v}},

 ru:'points',refs:['0-3:Low probability (~8%)','4-10:Intermediate probability (~29%)','≥11:High probability (~74%)'],

{id:'ts4_hit',n:'4Ts Score',a:'Heparin-Induced Thrombocytopenia Probability',c:'blood',d:'Pre-test probability of HIT based on thrombocytopenia pattern, timing, thrombosis, and alternative causes.',f:'Thrombocytopenia+Timing+Thrombosis+oTher causes (each 0-2)',
 F:[{i:'t_count',l:'Thrombocytopenia: 0=<30% fall or nadir<10, 1=30-50% fall or nadir 10-19, 2=>50% fall and nadir ≥20',p:'0-2',u:['pts'],cv:function(v){return v}},
    {i:'t_timing',l:'Timing of fall: 0=<4 days no recent exposure, 1=consistent but unclear, or onset after day 10, 2=clear onset days 5-10 or ≤1 day with recent exposure',p:'0-2',u:['pts'],cv:function(v){return v}},
    {i:'t_thromb',l:'Thrombosis/sequelae: 0=None, 1=Progressive/recurrent/erythematous skin lesions, 2=New confirmed thrombosis, skin necrosis, or anaphylactoid reaction',p:'0-2',u:['pts'],cv:function(v){return v}},
    {i:'t_other',l:'oTher causes: 0=Definite other cause present, 1=Possible other cause, 2=No other apparent cause',p:'0-2',u:['pts'],cv:function(v){return v}}],
 calc:function(v){return Math.round(+v.t_count+ +v.t_timing+ +v.t_thromb+ +v.t_other)},
 ru:'points',refs:['0-3:Low probability (~5%)','4-5:Intermediate probability (~14%)','6-8:High probability (~64%)'],
 interp:function(r){var v=+r;if(v<=3)return rn('Low Probability','4Ts '+v+' — ~5% HIT probability. Alternative diagnosis likely; heparin can generally continue.');if(v<=5)return rw('Intermediate Probability','4Ts '+v+' — ~14% HIT probability. Consider stopping heparin, send HIT antibody assay.');return rh('High Probability','4Ts '+v+' — ~64% HIT probability. Stop all heparin, start non-heparin anticoagulant, confirm with functional assay.')}},

{id:'imrie_score',n:'Glasgow-Imrie Score',a:'Pancreatitis Severity',c:'gi',d:'Predicts severity of acute pancreatitis at 48h using 8 criteria (PANCREAS mnemonic). ≥3 = severe.',f:'PaO2+Age+Neutrophils(WCC)+Calcium+Renal(Urea)+Enzymes(LDH)+Albumin+Sugar(Glucose), each 0/1',

 calc:function(v){return Math.round(+v.im_pao2+ +v.im_age+ +v.im_wcc+ +v.im_ca+ +v.im_urea+ +v.im_ldh+ +v.im_alb+ +v.im_glu)},

{id:'phq9',n:'PHQ-9',a:'Patient Health Questionnaire — Depression',c:'neuro',d:'Screens for and grades severity of depressive symptoms over the past 2 weeks. Each item scored 0 (not at all) to 3 (nearly every day).',f:'Sum of 9 items, each 0-3',
 F:[{i:'q1',l:'Little interest or pleasure in doing things (0-3)',p:'0-3',u:['pts'],cv:function(v){return v}},
    {i:'q2',l:'Feeling down, depressed, or hopeless (0-3)',p:'0-3',u:['pts'],cv:function(v){return v}},

 calc:function(v){return Math.round(+v.q1+ +v.q2+ +v.q3+ +v.q4+ +v.q5+ +v.q6+ +v.q7+ +v.q8+ +v.q9)},
 ru:'points',refs:['0-4:Minimal','5-9:Mild','10-14:Moderate','15-19:Moderately severe','20-27:Severe'],

{id:'sf_syncope',n:'San Francisco Syncope Rule',a:'Serious Outcome Prediction',c:'cardiac',d:'Identifies syncope patients at risk of a serious outcome (death, MI, arrhythmia, PE, stroke, SAH, significant haemorrhage) within 7 days. Any positive criterion = high risk.',f:'CHF history+Haematocrit<30+Abnormal ECG+SOB+SBP<90',
 F:[{i:'sf_chf',l:'History of congestive heart failure (1=Yes)',p:'0/1',u:['pts'],cv:function(v){return v}},
    {i:'sf_hct',l:'Haematocrit <30% (1=Yes)',p:'0/1',u:['pts'],cv:function(v){return v}},
    {i:'sf_ecg',l:'Abnormal ECG (new changes or non-sinus rhythm) (1=Yes)',p:'0/1',u:['pts'],cv:function(v){return v}},

    {i:'sf_sbp',l:'Triage systolic BP <90 mmHg (1=Yes)',p:'0/1',u:['pts'],cv:function(v){return v}}],
 calc:function(v){return Math.round(+v.sf_chf+ +v.sf_hct+ +v.sf_ecg+ +v.sf_sob+ +v.sf_sbp)},
 ru:'criteria positive',refs:['0:Low risk','≥1:High risk — admit/observe'],
 interp:function(r){var v=+r;if(v===0)return rn('Low Risk','0 criteria met. Low risk of serious outcome at 7 days. Consider outpatient work-up.');return rh('High Risk',v+' criteria met. Elevated risk of serious outcome — admit for monitoring and further evaluation.')}},

{id:'nyha_class',n:'NYHA Functional Classification',a:'New York Heart Association Class',c:'cardiac',d:'Classifies severity of heart failure symptoms based on limitation of physical activity.',f:'Class I-IV based on symptom threshold',
 F:[{i:'nyha',l:'Class: 1=No limitation, 2=Slight limitation (comfortable at rest), 3=Marked limitation (comfortable at rest), 4=Symptoms at rest',p:'1-4',u:['class'],cv:function(v){return Math.round(+v)}}],
 calc:function(v){return v.nyha},
 ru:'NYHA class',
 refs:['I:No limitation','II:Slight limitation','III:Marked limitation','IV:Symptoms at rest'],
 interp:function(r){var v=+r;var msgs=['','No limitation of physical activity. Ordinary activity does not cause symptoms.','Slight limitation of physical activity. Comfortable at rest, but ordinary activity causes symptoms.','Marked limitation of physical activity. Comfortable at rest, but less-than-ordinary activity causes symptoms.','Unable to carry out any physical activity without symptoms, or symptoms present at rest.'];var fn=[ri,rn,rl,rw,rh];return(fn[v]||ri)('NYHA Class '+(v?['','I','II','III','IV'][v]:''),msgs[v]||'')}},

{id:'mallampati',n:'Mallampati Score',a:'Airway Assessment',c:'resp',d:'Predicts difficulty of tracheal intubation based on visibility of oropharyngeal structures with mouth fully open and tongue protruded.',f:'Class I-IV based on visible structures',
 F:[{i:'mp',l:'Class: 1=Soft palate+uvula+fauces+pillars fully visible, 2=Soft palate+uvula+fauces visible, 3=Soft palate+base of uvula visible, 4=Soft palate not visible',p:'1-4',u:['class'],cv:function(v){return Math.round(+v)}}],
 calc:function(v){return v.mp},
 ru:'Mallampati class',
 refs:['I:Easy intubation predicted','II:Generally easy','III:Potentially difficult','IV:Difficult intubation predicted'],
 interp:function(r){var v=+r;var msgs=['','Full view of soft palate, uvula, fauces, and pillars. Easy laryngoscopy predicted.','Soft palate, uvula, and fauces visible. Generally straightforward intubation.','Only soft palate and base of uvula visible. Potentially difficult laryngoscopy — have backup airway plan ready.','Soft palate not visible at all. Difficult intubation predicted — anticipate and prepare difficult airway equipment/personnel.'];var fn=[ri,rn,rn,rw,rh];return(fn[v]||ri)('Class '+(v?['','I','II','III','IV'][v]:''),msgs[v]||'')}},

{id:'spesi',n:'sPESI',a:'Simplified Pulmonary Embolism Severity Index',c:'resp',d:'Predicts 30-day mortality risk in patients with confirmed PE using 6 simple criteria, 1 point each.',f:'Age>80+Cancer+Cardiopulmonary disease+HR≥110+SBP<100+O2sat<90%',
 F:[{i:'sp_age',l:'Age >80 years (1=Yes)',p:'0/1',u:['pts'],cv:function(v){return v}},
    {i:'sp_ca',l:'History of cancer (1=Yes)',p:'0/1',u:['pts'],cv:function(v){return v}},
    {i:'sp_cpd',l:'Chronic cardiopulmonary disease (1=Yes)',p:'0/1',u:['pts'],cv:function(v){return v}},
    {i:'sp_hr',l:'Heart rate ≥110 bpm (1=Yes)',p:'0/1',u:['pts'],cv:function(v){return v}},
    {i:'sp_sbp',l:'Systolic BP <100 mmHg (1=Yes)',p:'0/1',u:['pts'],cv:function(v){return v}},
    {i:'sp_o2',l:'O₂ saturation <90% (1=Yes)',p:'0/1',u:['pts'],cv:function(v){return v}}],
 calc:function(v){return Math.round(+v.sp_age+ +v.sp_ca+ +v.sp_cpd+ +v.sp_hr+ +v.sp_sbp+ +v.sp_o2)},

 interp:function(r){var v=+r;if(v===0)return rn('Low Risk','sPESI 0 — ~1% 30-day mortality. Consider outpatient management if otherwise suitable.');return rh('High Risk','sPESI '+v+' — ~10.9% 30-day mortality. Inpatient management recommended.')}},

{id:'nexus_cspine',n:'NEXUS Criteria',a:'Cervical Spine Imaging Rule',c:'ortho',d:'Determines need for cervical spine imaging after trauma. If all 5 criteria negative, imaging can be safely avoided.',f:'Midline tenderness+Neuro deficit+Altered consciousness+Intoxication+Distracting injury',
 F:[{i:'nx_tender',l:'Posterior midline cervical tenderness (1=Yes)',p:'0/1',u:['pts'],cv:function(v){return v}},
    {i:'nx_neuro',l:'Focal neurological deficit (1=Yes)',p:'0/1',u:['pts'],cv:function(v){return v}},
    {i:'nx_alert',l:'Altered level of consciousness (1=Yes)',p:'0/1',u:['pts'],cv:function(v){return v}},
    {i:'nx_intox',l:'Evidence of intoxication (1=Yes)',p:'0/1',u:['pts'],cv:function(v){return v}},
    {i:'nx_distr',l:'Painful distracting injury (1=Yes)',p:'0/1',u:['pts'],cv:function(v){return v}}],
 calc:function(v){return Math.round(+v.nx_tender+ +v.nx_neuro+ +v.nx_alert+ +v.nx_intox+ +v.nx_distr)},
 ru:'criteria positive',refs:['0:Imaging not required','≥1:Imaging indicated'],
 interp:function(r){var v=+r;if(v===0)return rn('Imaging Not Required','All 5 NEXUS criteria negative. C-spine imaging can be safely avoided.');return rh('Imaging Indicated',v+' criteria positive. C-spine imaging (CT) recommended.')}},

{id:'canadian_cspine',n:'Canadian C-Spine Rule',a:'Cervical Spine Imaging Decision',c:'ortho',d:'Clinical decision rule for alert, stable trauma patients to determine need for C-spine imaging.',f:'High-risk factors → image; else Low-risk factors + ability to rotate neck determines need',
 F:[{i:'cc_high',l:'Any high-risk factor present (age≥65, dangerous mechanism, paraesthesias in extremities) (1=Yes)',p:'0/1',u:['flag'],cv:function(v){return v}},
    {i:'cc_low',l:'Any low-risk factor allowing safe assessment (simple rear-end MVC, sitting in ED, ambulatory at any time, delayed neck pain onset, no midline tenderness) (1=Yes)',p:'0/1',u:['flag'],cv:function(v){return v}},
    {i:'cc_rotate',l:'Able to actively rotate neck 45° left and right (1=Yes)',p:'0/1',u:['flag'],cv:function(v){return v}}],
 calc:function(v){if(+v.cc_high)return 2;if(!+v.cc_low)return 2;if(!+v.cc_rotate)return 1;return 0},
 ru:'result',refs:['0:No imaging required','1:Imaging required (unable to rotate/assess)','2:Imaging required (high risk or no low-risk factor)'],
 interp:function(r){var v=+r;if(v===0)return rn('Imaging Not Required','No high-risk factors, a low-risk factor is present, and the patient can rotate their neck 45° both ways. C-spine imaging can be safely avoided.');if(v===1)return rw('Imaging Required','Low-risk factor present but patient unable to actively rotate neck 45°. Imaging recommended.');return rh('Imaging Required','High-risk factor present, or no low-risk factor allows safe clinical assessment. C-spine imaging (CT) recommended.')}},

{id:'rass',n:'RASS',a:'Richmond Agitation-Sedation Scale',c:'neuro',d:'Assesses level of sedation or agitation in critically ill patients, guiding sedation titration.',f:'Scored -5 (unarousable) to +4 (combative)',
 F:[{i:'rass_v',l:'Score: +4=Combative, +3=Very agitated, +2=Agitated, +1=Restless, 0=Alert and calm, -1=Drowsy, -2=Light sedation, -3=Moderate sedation, -4=Deep sedation, -5=Unarousable',p:'-5 to 4',u:['score'],cv:function(v){return Math.round(+v)}}],
 calc:function(v){return v.rass_v},
 ru:'RASS score',
 refs:['+4:Combative','+3:Very agitated','+2:Agitated','+1:Restless','0:Alert and calm','-1:Drowsy','-2:Light sedation','-3:Moderate sedation','-4:Deep sedation','-5:Unarousable'],
 interp:function(r){var v=+r;var labels={4:'Combative',3:'Very Agitated',2:'Agitated',1:'Restless',0:'Alert and Calm','-1':'Drowsy','-2':'Light Sedation','-3':'Moderate Sedation','-4':'Deep Sedation','-5':'Unarousable'};var lbl=labels[v]!==undefined?labels[v]:'Out of range';var fn;if(v===0)fn=rn;else if(v>0)fn=v>=3?rh:rw;else fn=v<=-4?rh:v<=-2?rw:rl;return fn('RASS '+(v>0?'+':'')+v+' — '+lbl,v>0?'Agitation present. Assess for pain, delirium, or under-sedation; consider treating underlying cause.':v<0?'Sedated. Titrate sedation to target RASS per unit protocol; assess for over-sedation.':'Patient alert and calm — at target for most ICU sedation goals.')}},

{id:'hunt_hess',n:'Hunt and Hess Grade',a:'Subarachnoid Haemorrhage Severity',c:'neuro',d:'Grades clinical severity of aneurysmal subarachnoid haemorrhage, correlating with surgical risk and prognosis.',f:'Grade I-V based on clinical presentation',
 F:[{i:'hh',l:'Grade: 1=Asymptomatic/mild headache, 2=Moderate-severe headache+nuchal rigidity, 3=Drowsy/confused±mild focal deficit, 4=Stupor+moderate-severe hemiparesis, 5=Deep coma/decerebrate',p:'1-5',u:['grade'],cv:function(v){return Math.round(+v)}}],
 calc:function(v){return v.hh},
 ru:'Hunt-Hess grade',
 refs:['I:~70% survival','II:~60% survival','III:~50% survival','IV:~20% survival','V:~10% survival'],
 interp:function(r){var v=+r;var msgs=['','Asymptomatic or minimal headache and slight nuchal rigidity. Good prognosis.','Moderate-severe headache, nuchal rigidity, no neurological deficit other than cranial nerve palsy.','Drowsiness, confusion, or mild focal deficit.','Stupor, moderate-severe hemiparesis, possibly early decerebrate rigidity.','Deep coma, decerebrate rigidity, moribund appearance. Poor prognosis.'];var fn=[ri,rn,rl,rw,rh,rh];return(fn[v]||ri)('Grade '+(v?['','I','II','III','IV','V'][v]:''),msgs[v]||'')}},

{id:'fisher_scale',n:'Modified Fisher Scale',a:'SAH Vasospasm Risk (CT-based)',c:'neuro',d:'Grades subarachnoid haemorrhage on CT to predict risk of cerebral vasospasm.',f:'Grade 0-4 based on blood thickness and presence of intraventricular haemorrhage',
 F:[{i:'fs',l:'Grade: 0=No SAH/IVH, 1=Thin SAH no IVH, 2=Thin SAH with IVH, 3=Thick SAH no IVH, 4=Thick SAH with IVH',p:'0-4',u:['grade'],cv:function(v){return Math.round(+v)}}],
 calc:function(v){return v.fs},
 ru:'Fisher grade',
 refs:['0:Minimal vasospasm risk','1:Low risk (~24%)','2:Low risk (~33%)','3:High risk (~33-38%)','4:High risk (~34%)'],
 interp:function(r){var v=+r;var msgs=['No subarachnoid or intraventricular blood seen. Minimal vasospasm risk.','Thin/focal SAH, no IVH. Relatively low vasospasm risk.','Thin SAH with IVH present. Low-moderate vasospasm risk.','Thick, diffuse SAH, no IVH. High vasospasm risk — close monitoring warranted.','Thick, diffuse SAH with IVH. High vasospasm risk — close monitoring warranted.'];var fn=[rn,rn,rl,rw,rh];return(fn[v]||ri)('Modified Fisher Grade '+v,msgs[v]||'')}},

{id:'maddrey_df',n:"Maddrey's Discriminant Function",a:'Alcoholic Hepatitis Severity',c:'liver',d:'Predicts short-term mortality and steroid-treatment benefit in severe alcoholic hepatitis. DF = 4.6×(patient PT − control PT) + total bilirubin (mg/dL).',f:'4.6×(PT−control PT)+Bilirubin(mg/dL)',
 F:[{i:'md_pt',l:"Patient's prothrombin time",p:'sec',u:['sec'],cv:function(v){return v}},
    {i:'md_ptc',l:'Control (lab reference) prothrombin time',p:'sec',u:['sec'],cv:function(v){return v}},
    {i:'md_bili',l:'Total bilirubin',p:'mg/dL',u:['mg/dL'],cv:function(v){return v}}],
 calc:function(v){return Math.round((4.6*(+v.md_pt-+v.md_ptc)+ +v.md_bili)*10)/10},
 ru:'DF score',refs:['<32:Mild disease, 90% 30-day survival without steroids','≥32:Severe disease, ~50% 30-day mortality — consider corticosteroids'],
 interp:function(r){var v=+r;if(v<32)return rn('Mild Disease','DF '+v+'. <32 — mild-moderate alcoholic hepatitis; corticosteroids not indicated on DF alone.');return rh('Severe Disease','DF '+v+'. ≥32 — severe alcoholic hepatitis with ~50% 30-day mortality untreated. Consider corticosteroids if no contraindication.')}},

{id:'apfel_score',n:'Apfel Score',a:'Post-Operative Nausea & Vomiting Risk',c:'meta',d:'Predicts risk of PONV in adults undergoing general anaesthesia using 4 independent risk factors.',f:'Female sex+Non-smoker+PONV/motion sickness history+Postop opioids, 1 point each',
 F:[{i:'ap_sex',l:'Female sex (1=Yes)',p:'0/1',u:['pts'],cv:function(v){return v}},
    {i:'ap_smoke',l:'Non-smoker (1=Yes)',p:'0/1',u:['pts'],cv:function(v){return v}},
    {i:'ap_hist',l:'History of PONV or motion sickness (1=Yes)',p:'0/1',u:['pts'],cv:function(v){return v}},
    {i:'ap_opioid',l:'Use of postoperative opioids (1=Yes)',p:'0/1',u:['pts'],cv:function(v){return v}}],
 calc:function(v){return Math.round(+v.ap_sex+ +v.ap_smoke+ +v.ap_hist+ +v.ap_opioid)},
 ru:'risk factors',refs:['0:~10% PONV risk','1:~21% PONV risk','2:~39% PONV risk','3:~61% PONV risk','4:~79% PONV risk'],
 interp:function(r){var v=+r;var pct=['~10%','~21%','~39%','~61%','~79%'][v]||'';if(v<=1)return rn('Low Risk','Apfel '+v+'/4 — '+pct+' PONV risk. Routine prophylaxis generally not required.');if(v===2)return rw('Moderate Risk','Apfel '+v+'/4 — '+pct+' PONV risk. Consider 1-2 prophylactic antiemetics.');return rh('High Risk','Apfel '+v+'/4 — '+pct+' PONV risk. Multimodal antiemetic prophylaxis and consider TIVA.')}},

{id:'lights_criteria',n:"Light's Criteria",a:'Pleural Effusion — Exudate vs Transudate',c:'resp',d:'Differentiates exudative from transudative pleural effusions. Meeting any one criterion classifies the effusion as exudate.',f:'Pleural/serum protein>0.5, Pleural/serum LDH>0.6, or Pleural LDH>⅔ upper limit of normal serum LDH',
 F:[{i:'lc_pprot',l:'Pleural fluid protein',p:'g/dL',u:['g/dL'],cv:function(v){return v}},
    {i:'lc_sprot',l:'Serum protein',p:'g/dL',u:['g/dL'],cv:function(v){return v}},
    {i:'lc_pldh',l:'Pleural fluid LDH',p:'IU/L',u:['IU/L'],cv:function(v){return v}},
    {i:'lc_sldh',l:'Serum LDH',p:'IU/L',u:['IU/L'],cv:function(v){return v}},
    {i:'lc_uln',l:'Upper limit of normal serum LDH (lab reference)',p:'IU/L',u:['IU/L'],cv:function(v){return v}}],
 calc:function(v){var pr=+v.lc_pprot/ +v.lc_sprot,ld=+v.lc_pldh/ +v.lc_sldh,hi=+v.lc_pldh>(2/3)*+v.lc_uln;return(pr>0.5||ld>0.6||hi)?1:0},
 ru:'classification',refs:['0:Transudate — treat systemic cause (e.g. CHF, cirrhosis, nephrotic syndrome)','1:Exudate — further pleural fluid work-up needed (infection, malignancy, inflammatory)'],
 interp:function(r){var v=+r;if(v===0)return rn('Transudate',"No Light's criteria met. Consistent with transudate — evaluate for CHF, cirrhosis, or nephrotic syndrome.");return rw('Exudate',"At least one Light's criterion met. Consistent with exudate — evaluate for infection, malignancy, or inflammatory cause.")}},

{id:'barthel_index',n:'Barthel Index',a:'Activities of Daily Living',c:'neuro',d:'Measures functional independence in activities of daily living, commonly used in rehabilitation and stroke settings.',f:'Sum of 10 weighted ADL items (0-100)',
 F:[{i:'b_feed',l:'Feeding: 0=Unable, 5=Needs help, 10=Independent',p:'0/5/10',u:['pts'],cv:function(v){return v}},
    {i:'b_bath',l:'Bathing: 0=Dependent, 5=Independent',p:'0/5',u:['pts'],cv:function(v){return v}},
    {i:'b_groom',l:'Grooming: 0=Needs help, 5=Independent',p:'0/5',u:['pts'],cv:function(v){return v}},
    {i:'b_dress',l:'Dressing: 0=Dependent, 5=Needs help, 10=Independent',p:'0/5/10',u:['pts'],cv:function(v){return v}},
    {i:'b_bowel',l:'Bowel control: 0=Incontinent, 5=Occasional accident, 10=Continent',p:'0/5/10',u:['pts'],cv:function(v){return v}},
    {i:'b_bladder',l:'Bladder control: 0=Incontinent, 5=Occasional accident, 10=Continent',p:'0/5/10',u:['pts'],cv:function(v){return v}},
    {i:'b_toilet',l:'Toilet use: 0=Dependent, 5=Needs help, 10=Independent',p:'0/5/10',u:['pts'],cv:function(v){return v}},
    {i:'b_transfer',l:'Bed/chair transfer: 0=Unable, 5=Major help, 10=Minor help, 15=Independent',p:'0/5/10/15',u:['pts'],cv:function(v){return v}},
    {i:'b_mobil',l:'Mobility on level surface: 0=Immobile, 5=Wheelchair independent, 10=Walks with help, 15=Independent',p:'0/5/10/15',u:['pts'],cv:function(v){return v}},
    {i:'b_stairs',l:'Stairs: 0=Unable, 5=Needs help, 10=Independent',p:'0/5/10',u:['pts'],cv:function(v){return v}}],
 calc:function(v){return Math.round(+v.b_feed+ +v.b_bath+ +v.b_groom+ +v.b_dress+ +v.b_bowel+ +v.b_bladder+ +v.b_toilet+ +v.b_transfer+ +v.b_mobil+ +v.b_stairs)},
 ru:'points (max 100)',refs:['0-20:Total dependency','21-60:Severe dependency','61-90:Moderate dependency','91-99:Slight dependency','100:Independent'],
 interp:function(r){var v=+r;if(v>=100)return rn('Independent','Barthel '+v+'/100. Fully independent in activities of daily living.');if(v>=91)return rl('Slight Dependency','Barthel '+v+'/100. Slight dependency; minimal assistance needed.');if(v>=61)return rw('Moderate Dependency','Barthel '+v+'/100. Moderate dependency; support needed for several ADLs.');if(v>=21)return rw('Severe Dependency','Barthel '+v+'/100. Severe dependency; significant assistance required across most ADLs.');return rh('Total Dependency','Barthel '+v+'/100. Total dependency; full assistance required for all ADLs.')}}
];
var CV=[
{id:'temp',n:'Temperature',em:'\u{1F321}\uFE0F',col:'#FF8F00',u:['\u00b0C','\u00b0F','K'],conv:function(v,f,t){var c=f=='\u00b0C'?v:f=='\u00b0F'?(v-32)*5/9:v-273.15;return t=='\u00b0C'?c:t=='\u00b0F'?c*9/5+32:c+273.15}},
{id:'weight',n:'Weight / Mass',em:'\u2696\uFE0F',col:'#2E7D32',u:['kg','g','mg','lb','oz','stone'],base:{kg:1,g:1e-3,mg:1e-6,lb:.4536,oz:.02835,stone:6.35},conv:function(v,f,t){return v*this.base[f]/this.base[t]}},
{id:'length',n:'Length / Height',em:'\u{1F4CF}',col:'#1565C0',u:['m','cm','mm','ft','in','miles'],base:{m:1,cm:.01,mm:1e-3,ft:.3048,in:.0254,miles:1609.34},conv:function(v,f,t){return v*this.base[f]/this.base[t]}},
{id:'volume',n:'Volume / Fluid',em:'\u{1F4A7}',col:'#0288D1',u:['L','mL','dL','\u00b5L','fl oz','cups','gallons','pints'],base:{L:1,mL:1e-3,dL:.1,'\u00b5L':1e-6,'fl oz':.02957,cups:.2366,gallons:3.7854,pints:.4732},conv:function(v,f,t){return v*this.base[f]/this.base[t]}},
{id:'pressure',n:'Pressure',em:'\u{1FA7A}',col:'#7B1FA2',u:['mmHg','kPa','Pa','atm','PSI','bar','cmH\u2082O'],base:{mmHg:133.322,kPa:1000,Pa:1,atm:101325,PSI:6894.76,bar:100000,'cmH\u2082O':98.0665},conv:function(v,f,t){return v*this.base[f]/this.base[t]}},
{id:'glucose',n:'Blood Glucose',em:'\u{1FA78}',col:'#880E4F',u:['mg/dL','mmol/L'],conv:function(v,f,t){return f==t?v:f=='mg/dL'?v/18.0182:v*18.0182}},
{id:'creat',n:'Creatinine',em:'\u{1FAD8}',col:'#1565C0',u:['mg/dL','\u00b5mol/L'],conv:function(v,f,t){return f==t?v:f=='mg/dL'?v*88.4:v/88.4}},
{id:'chol',n:'Cholesterol / Lipids',em:'\u2764\uFE0F',col:'#C62828',u:['mg/dL','mmol/L'],conv:function(v,f,t){return f==t?v:f=='mg/dL'?v/38.67:v*38.67}},
{id:'hgb',n:'Hemoglobin',em:'\u{1FA78}',col:'#B71C1C',u:['g/dL','g/L','mmol/L'],base:{'g/dL':10,'g/L':1,'mmol/L':16.11},conv:function(v,f,t){return v*this.base[f]/this.base[t]}},
{id:'bili',n:'Bilirubin',em:'\u{1F7E1}',col:'#F9A825',u:['mg/dL','\u00b5mol/L'],conv:function(v,f,t){return f==t?v:f=='mg/dL'?v*17.1:v/17.1}},
{id:'urea',n:'BUN / Urea',em:'\u{1F9EA}',col:'#2E7D32',u:['mg/dL (BUN)','mmol/L (Urea)'],conv:function(v,f,t){return f==t?v:f=='mg/dL (BUN)'?v/2.8:v*2.8}},
{id:'calcium',n:'Calcium',em:'\u{1F9B4}',col:'#BF360C',u:['mg/dL','mmol/L','mEq/L'],base:{'mg/dL':.2495,'mmol/L':1,'mEq/L':.5},conv:function(v,f,t){return v*this.base[f]/this.base[t]}},
{id:'uricacid',n:'Uric Acid',em:'\u{1F9AB}',col:'#283593',u:['mg/dL','\u00b5mol/L'],conv:function(v,f,t){return f==t?v:f=='mg/dL'?v*59.485:v/59.485}},
{id:'cortisol',n:'Cortisol',em:'\u{1F98B}',col:'#6A1B9A',u:['\u00b5g/dL','nmol/L','ng/mL'],base:{'\u00b5g/dL':27.59,'nmol/L':1,'ng/mL':2.759},conv:function(v,f,t){return v*this.base[f]/this.base[t]}},
{id:'phosphate',n:'Phosphate / Magnesium',em:'\u{1F48A}',col:'#2E7D32',u:['mg/dL','mmol/L','mEq/L'],base:{'mg/dL':.3229,'mmol/L':1,'mEq/L':.5},conv:function(v,f,t){return v*this.base[f]/this.base[t]}},
{id:'enzyme',n:'Enzyme Activity',em:'\u2697\uFE0F',col:'#E65100',u:['U/L','IU/L','\u00b5kat/L','nkat/L'],base:{'U/L':1,'IU/L':1,'\u00b5kat/L':60,'nkat/L':.06},conv:function(v,f,t){return v*this.base[f]/this.base[t]}},
{id:'hba1c_conv',n:'HbA1c Units',em:'\u{1F9EC}',col:'#880E4F',u:['% (DCCT)','mmol/mol (IFCC)'],conv:function(v,f,t){return f==t?v:f=='% (DCCT)'?+(10.929*(v-2.15)).toFixed(1):+((v/10.929)+2.15).toFixed(2)}},
{id:'vitd',n:'Vitamin D',em:'\u2600\uFE0F',col:'#F9A825',u:['ng/mL','nmol/L'],conv:function(v,f,t){return f==t?v:f=='ng/mL'?v*2.496:v/2.496}},

/* ──────────────────────────────────────────────────────────
   CORE STATE
   ────────────────────────────────────────────────────────── */
var cat = 'all';

var activeConv = null;

/* ──────────────────────────────────────────────────────────
   MODAL HELPERS
   ────────────────────────────────────────────────────────── */
function openModal() {
  document.getElementById('modal-overlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeModal() {
  document.getElementById('modal-overlay').classList.remove('open');
  document.body.style.overflow = '';
  activeMed = null; activeConv = null;
  renderMed(); renderConv();
}
function handleOverlayClick(e) {
  if (e.target === document.getElementById('modal-overlay')) closeModal();
}
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape' && document.getElementById('modal-overlay').classList.contains('open')) closeModal();
});

/* ──────────────────────────────────────────────────────────
   PAGINATION BUILDER
   ────────────────────────────────────────────────────────── */
function buildPagination(current, total, pages, onPage, elId) {
  var el = document.getElementById(elId);
  if (!el) return;
  if (pages <= 1) { el.style.display = 'none'; return; }
  el.style.display = 'flex';

  var chevL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>';
  var chevR = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg>';

  // Build page number buttons (show max 5 around current)
  var nums = '';
  var start = Math.max(1, current - 2);
  var end   = Math.min(pages, start + 4);
  if (end - start < 4) start = Math.max(1, end - 4);

  if (start > 1) nums += '<button class="page-btn" data-pg="1">1</button>'
    + (start > 2 ? '<span style="color:var(--n400);padding:0 2px;line-height:32px">…</span>' : '');
  for (var i = start; i <= end; i++) {
    nums += '<button class="page-btn' + (i === current ? ' active' : '') + '" data-pg="' + i + '">' + i + '</button>';
  }
  if (end < pages) {
    nums += (end < pages - 1 ? '<span style="color:var(--n400);padding:0 2px;line-height:32px">…</span>' : '')
      + '<button class="page-btn" data-pg="' + pages + '">' + pages + '</button>';
  }

  var from = (current - 1) * PER_PAGE + 1;
  var to   = Math.min(current * PER_PAGE, total);

  el.innerHTML =
    '<div class="page-info">Showing <span>' + from + '-' + to + '</span> of <span>' + total + '</span></div>'
    + '<div class="page-controls">'
    + '<button class="page-btn" data-pg="' + (current - 1) + '"' + (current <= 1 ? ' disabled' : '') + '>' + chevL + '</button>'
    + '<div class="page-nums">' + nums + '</div>'
    + '<button class="page-btn" data-pg="' + (current + 1) + '"' + (current >= pages ? ' disabled' : '') + '>' + chevR + '</button>'
    + '</div>';

  el.querySelectorAll('[data-pg]').forEach(function(btn) {
    btn.addEventListener('click', function() {
      var pg = parseInt(btn.getAttribute('data-pg'));
      if (pg >= 1 && pg <= pages && !btn.disabled) onPage(pg);
    });
  });
}

/* ──────────────────────────────────────────────────────────
   RENDER CALCULATORS LIST (PAGINATED)
   ────────────────────────────────────────────────────────── */
function renderMed() {
  var q = (document.getElementById('med-q') || {}).value || '';
  q = q.toLowerCase().trim();
  var list = T.filter(function(t) {
    return (cat === 'all' || t.c === cat) &&
      (!q || t.n.toLowerCase().includes(q) || t.a.toLowerCase().includes(q));
  });

  var countEl = document.getElementById('med-count');
  if (countEl) countEl.textContent = list.length;

  var el = document.getElementById('med-list');
  if (!el) return;

  if (!list.length) {
    el.innerHTML = '<div class="empty-state"><div class="empty-icon">🔍</div><div class="empty-text">No calculators found</div></div>';
    var pg = document.getElementById('med-pagination');
    if (pg) pg.style.display = 'none';
    return;
  }

  var pages = Math.ceil(list.length / PER_PAGE);
  if (medPage > pages) medPage = pages;
  var slice = list.slice((medPage - 1) * PER_PAGE, medPage * PER_PAGE);

  var out = '';
  slice.forEach(function(t) {
    var cc = CCAT[t.c] || { em: '🔬', bg: '#E8EAF6' };
    out += '<div class="calc-item" data-tid="' + t.id + '">'
      + '<div class="ci-icon" style="background:' + cc.bg + '">' + cc.em + '</div>'
      + '<div class="ci-body">'
      + '<div class="ci-name">' + t.n + '</div>'
      + '<div class="ci-sub">' + t.a + '</div>'
      + '</div>'
      + '<div class="ci-arr"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg></div>'
      + '</div>';
  });
  el.innerHTML = out;
  el.querySelectorAll('[data-tid]').forEach(function(d) {
    d.addEventListener('click', function() { openTest(d.getAttribute('data-tid')); });
  });

  buildPagination(medPage, list.length, pages, function(pg) {
    medPage = pg;
    renderMed();
    document.getElementById('p-med').scrollTo(0, 0);
    window.scrollTo(0, 0);
  }, 'med-pagination');
}

/* ──────────────────────────────────────────────────────────
   RENDER CONVERTERS LIST (PAGINATED)
   ────────────────────────────────────────────────────────── */
function renderConv() {
  var q = (document.getElementById('conv-q') || {}).value || '';
  q = q.toLowerCase().trim();
  var list = CV.filter(function(c) { return !q || c.n.toLowerCase().includes(q); });

  var countEl = document.getElementById('conv-count');
  if (countEl) countEl.textContent = list.length;

  var el = document.getElementById('conv-list');
  if (!el) return;

  if (!list.length) {
    el.innerHTML = '<div class="empty-state"><div class="empty-icon">🔍</div><div class="empty-text">No converters found</div></div>';
    var pg = document.getElementById('conv-pagination');
    if (pg) pg.style.display = 'none';
    return;
  }

  var pages = Math.ceil(list.length / PER_PAGE);
  if (convPage > pages) convPage = pages;
  var slice = list.slice((convPage - 1) * PER_PAGE, convPage * PER_PAGE);

  var out = '';
  slice.forEach(function(c) {
    var units = c.u ? c.u.slice(0, 3).join(' · ') : '';
    out += '<div class="calc-item" data-cid="' + c.id + '">'
      + '<div class="ci-icon" style="background:' + c.col + '22">' + c.em + '</div>'
      + '<div class="ci-body">'
      + '<div class="ci-name">' + c.n + '</div>'
      + '<div class="ci-sub">' + units + '</div>'
      + '</div>'
      + '<div class="ci-arr"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg></div>'
      + '</div>';
  });
  el.innerHTML = out;
  el.querySelectorAll('[data-cid]').forEach(function(d) {
    d.addEventListener('click', function() { openConv(d.getAttribute('data-cid')); });
  });

  buildPagination(convPage, list.length, pages, function(pg) {
    convPage = pg;
    renderConv();
    window.scrollTo(0, 0);
  }, 'conv-pagination');
}

/* ──────────────────────────────────────────────────────────
   CATEGORY + TAB SWITCH
   ────────────────────────────────────────────────────────── */
function setCat(c, el) {
  cat = c; medPage = 1;
  document.querySelectorAll('.cat-chip').forEach(function(ch) { ch.classList.remove('active'); });
  if (el) el.classList.add('active');
  renderMed();
}
function switchTab(t, el) {
  ['med','conv'].forEach(function(p) {
    document.getElementById('p-' + p).classList.remove('active');
    document.getElementById('tab-' + p).classList.remove('active');
  });
  document.getElementById('p-' + t).classList.add('active');
  if (el) el.classList.add('active');
}

   OPEN CALCULATOR IN MODAL
   ────────────────────────────────────────────────────────── */
function openTest(id) {
  activeMed = id;
  var t = T.filter(function(x) { return x.id === id; })[0];
  if (!t) return;
  var cc = CCAT[t.c] || { em: '🔬', bg: '#E8EAF6', gr: 'linear-gradient(135deg,#3949AB,#5C6BC0)' };
  if (!SX[id]) SX[id] = 'M';

  var sxH = '';
  if (t.sex) {
    sxH = '<div class="field"><label class="field-label">Biological Sex</label>'
      + '<div class="sex-toggle">'
      + '<div class="sex-btn active" id="sx-M-' + id + '" data-sex="M" data-tid="' + id + '"><span class="sex-check">✓</span>♂ Male</div>'
      + '<div class="sex-btn" id="sx-F-' + id + '" data-sex="F" data-tid="' + id + '"><span class="sex-check">✓</span>♀ Female</div>'
      + '</div></div>';
  }

  var fH = t.F.map(function(f) {
    var multi = f.u && f.u.length > 1;
    var uCtrl = multi
      ? '<select class="field-unit-sel" id="u-' + id + '-' + f.i + '">'
          + f.u.map(function(u, k) { return '<option value="' + u + '"' + (k === 0 ? ' selected' : '') + '>' + u + '</option>'; }).join('')
          + '</select>'
      : (f.u ? '<div class="field-unit-badge">' + f.u[0] + '</div>' : '');
    return '<div class="field"><label class="field-label">' + f.l + '</label>'
      + '<div class="field-row" id="fr-' + id + '-' + f.i + '">'
      + '<input class="field-input" type="number" id="f-' + id + '-' + f.i + '" placeholder="' + f.p + '" step="any">'
      + uCtrl + '</div></div>';
  }).join('');

  var panel = document.getElementById('modal-panel');
  panel.innerHTML =
    '<div class="modal-pill"></div>'
    + '<button class="modal-close" onclick="closeModal()" aria-label="Close">'
    + '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>'
    + '</button>'
    + '<div class="calc-hero" style="background:' + cc.gr + '">'
    + '<div class="hero-row">'
    + '<div class="hero-icon">' + cc.em + '</div>'
    + '<div><div class="hero-name">' + t.n + '</div>'
    + '<div class="hero-abbr">' + t.a + '</div></div></div>'
    + '<div class="hero-desc">' + t.d + '</div>'
    + '<div class="hero-formula">ƒ&nbsp;' + t.f + '</div></div>'
    + '<div class="calc-body">' + sxH + fH
    + '<div class="btn-row">'
    + '<button class="btn btn-primary" data-calc="' + id + '">'
    + '<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>'
    + 'Calculate</button>'
    + '<button class="btn btn-secondary" data-clear="' + id + '">'
    + '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-3.91"/></svg>'
    + 'Reset</button>'
    + '</div>'
    + '<div id="res-' + id + '" class="result-card"></div></div>';

  // Wire events
  panel.querySelectorAll('[data-sex]').forEach(function(el) {
    el.addEventListener('click', function() { pickSex(el.getAttribute('data-tid'), el.getAttribute('data-sex')); });
  });
  panel.querySelectorAll('.field-input').forEach(function(inp) {
    inp.addEventListener('input', function() {
      var frId = 'fr-' + id + '-' + inp.id.replace('f-' + id + '-', '');
      var fr = document.getElementById(frId);
      if (fr) fr.classList.remove('error');
    });
  });
  var calcBtn = panel.querySelector('[data-calc]');
  var clearBtn = panel.querySelector('[data-clear]');
  if (calcBtn) calcBtn.addEventListener('click', function() { doCalc(id); });
  if (clearBtn) clearBtn.addEventListener('click', function() { clearCalc(id); });

  panel.scrollTop = 0;
  openModal();
}

/* ──────────────────────────────────────────────────────────
   OPEN CONVERTER IN MODAL
   ────────────────────────────────────────────────────────── */
function openConv(id) {
  activeConv = id;
  var c = CV.filter(function(x) { return x.id === id; })[0];
  if (!c) return;
  var panel = document.getElementById('modal-panel');
  var closeBtn = '<div class="modal-pill"></div>'
    + '<button class="modal-close" onclick="closeModal()" aria-label="Close">'
    + '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>'
    + '</button>';

  if (!c.conv) {
    var special = id === 'dose_calc' ? buildDose(c.col) : id === 'iv_calc' ? buildIV(c.col) : buildBMI(c.col);
    panel.innerHTML = closeBtn + special;
    panel.scrollTop = 0;
    openModal();
    return;
  }

  var o0 = c.u.map(function(u, i) { return '<option value="' + u + '"' + (i === 0 ? ' selected' : '') + '>' + u + '</option>'; }).join('');
  var o1 = c.u.map(function(u, i) { return '<option value="' + u + '"' + (i === 1 ? ' selected' : '') + '>' + u + '</option>'; }).join('');

  panel.innerHTML = closeBtn
    + '<div class="conv-hero" style="background:linear-gradient(135deg,' + c.col + ',' + c.col + 'BB)">'
    + '<div class="conv-hero-icon">' + c.em + '</div>'
    + '<div class="conv-hero-name">' + c.n + '</div>'
    + '<div class="conv-hero-sub">' + c.u.length + ' unit types</div></div>'
    + '<div class="calc-body">'
    + '<div class="field"><label class="field-label">From</label>'
    + '<div class="field-row"><input class="field-input" type="number" id="cv-in-' + id + '" placeholder="Enter value" step="any">'
    + '<select class="field-unit-sel" id="cv-from-' + id + '">' + o0 + '</select></div></div>'
    + '<div style="text-align:center">'
    + '<button class="swap-btn" data-swap="' + id + '">'
    + '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>'
    + '</button></div>'
    + '<div class="field"><label class="field-label">To</label>'
    + '<div class="field-row"><input class="field-input" type="number" id="cv-out-' + id + '" placeholder="Result" readonly>'
    + '<select class="field-unit-sel" id="cv-to-' + id + '">' + o1 + '</select></div></div>'
    + '<div class="conv-result" id="cv-res-' + id + '">Enter a value above to convert</div>'
    + '</div>';

  var inp   = panel.querySelector('#cv-in-'   + id);
  var from  = panel.querySelector('#cv-from-' + id);
  var to    = panel.querySelector('#cv-to-'   + id);
  var swap  = panel.querySelector('[data-swap]');
  if (inp)  inp.addEventListener('input',  function() { doConv(id); });
  if (from) from.addEventListener('change', function() { doConv(id); });
  if (to)   to.addEventListener('change',   function() { doConv(id); });
  if (swap) swap.addEventListener('click',  function() { swapConv(id); });

  panel.scrollTop = 0;
  openModal();
}

/* ──────────────────────────────────────────────────────────
   CALCULATE
   ────────────────────────────────────────────────────────── */
function doCalc(id) {
  var t = T.filter(function(x) { return x.id === id; })[0];
  if (!t) return;
  var s = SX[id] || 'M';
  var vals = {}; var ok = true;
  for (var i = 0; i < t.F.length; i++) {
    var f = t.F[i];
    var el = document.getElementById('f-' + id + '-' + f.i);
    var fr = document.getElementById('fr-' + id + '-' + f.i);
    if (!el) continue;
    if (el.value === '' || isNaN(+el.value)) {
      if (t.allowEmpty) { vals[f.i] = f.cv('', f.u ? f.u[0] : ''); continue; }
      if (fr) fr.classList.add('error');
      el.focus(); ok = false; break;
    }
    var uSel = document.getElementById('u-' + id + '-' + f.i);
    vals[f.i] = f.cv(+el.value, uSel ? uSel.value : (f.u ? f.u[0] : ''));
  }
  if (!ok) return;
  var result = t.sex ? t.calc(vals, s) : t.calc(vals);
  var rawNum = parseFloat(result);
  var interp = t.rawCalc ? t.interp(String(result), vals)
    : (t.sex ? t.interp(String(result), s) : t.interp(String(result)));
  if (!interp) return;

  var ruSel = '';
  if (t.ruU && t.ruU.length > 1) {
    ruSel = '<div class="result-unit-row">'
      + '<span class="result-unit-label">Convert to</span>'
      + '<select class="result-unit-sel" id="ru-sel-' + id + '">'
      + t.ruU.map(function(u, k) { return '<option value="' + k + '">' + u + '</option>'; }).join('')
      + '</select></div>';
  }

  var refsBlock = '';
  if (t.refs && t.refs.length) {
    refsBlock = '<div class="result-refs"><div class="result-refs-label">Reference Ranges</div>'
      + '<div class="result-refs-tags">'
      + t.refs.map(function(r) { return '<div class="ref-tag">' + r + '</div>'; }).join('')
      + '</div></div>';
  }

  var box = document.getElementById('res-' + id);
  if (!box) return;
  box.className = 'result-card show ' + interp.cls;
  box.innerHTML =
    '<div class="result-hd"><div class="result-hd-dot"></div>' + interp.st + '</div>'
    + '<div class="result-value">'
    + '<span class="result-num" id="rn-' + id + '">' + result + '</span>'
    + '<span class="result-unit" id="ru-' + id + '">' + t.ru + '</span></div>'
    + '<div class="result-text">' + interp.txt + '</div>'
    + ruSel + refsBlock;
  box._raw = rawNum;

  if (ruSel) {
    var sel = document.getElementById('ru-sel-' + id);
    if (sel) sel.addEventListener('change', function() { convertResult(id, this.selectedIndex); });
  }
  box.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function convertResult(id, idx) {
  var t = T.filter(function(x) { return x.id === id; })[0];
  if (!t || !t.ruF || !t.ruU) return;
  var box = document.getElementById('res-' + id);
  if (!box || box._raw === undefined) return;
  var val = t.ruF(box._raw, idx);
  var rnEl = document.getElementById('rn-' + id);
  var ruEl = document.getElementById('ru-' + id);
  if (rnEl) rnEl.textContent = val;
  if (ruEl) ruEl.textContent = t.ruU[idx];
}

/* ──────────────────────────────────────────────────────────
   SEX TOGGLE
   ────────────────────────────────────────────────────────── */
function pickSex(id, s) {
  SX[id] = s;
  ['M','F'].forEach(function(x) {
    var el = document.getElementById('sx-' + x + '-' + id);
    if (el) el.className = 'sex-btn' + (x === s ? ' active' : '');
  });
}

function clearCalc(id){
  var t=T.filter(function(x){return x.id===id})[0];
  t.F.forEach(function(f){
    var e=document.getElementById('f-'+id+'-'+f.i);
    var fr=document.getElementById('fr-'+id+'-'+f.i);
    if(e){e.value='';if(fr)fr.classList.remove('err')}
  });
  var b=document.getElementById('res-'+id);
  if(b){b.className='result-card';b.innerHTML='';b._raw=undefined}
}

function doConv(id){
  var c=CV.filter(function(x){return x.id===id})[0];
  var inp=document.getElementById('cv-in-'+id);
  var val=+inp.value,frm=document.getElementById('cv-from-'+id).value,to=document.getElementById('cv-to-'+id).value;
  var out=document.getElementById('cv-out-'+id),res=document.getElementById('cv-res-'+id);
  if(inp.value===''||isNaN(val)){out.value='';res.textContent='Enter a value above to convert';return}
  var r=c.conv(val,frm,to);
  var fmt=Math.abs(r)<1e-7&&r!==0?r.toExponential(4):parseFloat(r.toFixed(8)).toString();
  out.value=fmt;
  res.textContent=val+' '+frm+' = '+fmt+' '+to;
}

function swapConv(id){
  var f=document.getElementById('cv-from-'+id),t=document.getElementById('cv-to-'+id);
  var tmp=f.value;f.value=t.value;t.value=tmp;
  var i=document.getElementById('cv-in-'+id),o=document.getElementById('cv-out-'+id);
  if(o.value&&o.value!='') i.value=o.value;
  doConv(id);
}

function closeConv(){ closeModal(); activeConv=null; renderConv(); }

function buildDose(col){
  return '<div class="cv-hd" style="background:linear-gradient(135deg,'+col+','+col+'cc);color:#fff">'
    +'<button class="cc-close" onclick="closeConv()">\u00d7</button>'
    +'<div style="font-size:22px;margin-bottom:4px">\u{1F48A}</div>'
    +'<div style="font-size:16px;font-weight:700">Drug Dose Calculator</div>'
    +'<div style="font-size:11px;opacity:.8;margin-top:2px">Weight-based dosing</div></div>'
    +'<div class="cc-body">'
    +'<div class="fld"><label class="fld-lbl">Drug Name (optional)</label>'
    +'<input type="text" id="dd-drug" placeholder="e.g. Amoxicillin" style="width:100%;border:1.5px solid #DDE3EA;border-radius:9px;padding:10px 12px;font-size:14px;font-family:inherit;outline:none;color:#333"></div>'
    +'<div class="fld"><label class="fld-lbl">Dose per kg</label>'
    +'<div class="fld-row"><input class="inp" type="number" id="dd-dose" placeholder="e.g. 15" step="any">'
    +'<select class="usel" id="dd-du"><option>mg/kg</option><option>\u00b5g/kg</option><option>g/kg</option></select></div></div>'
    +'<div class="fld"><label class="fld-lbl">Patient Weight</label>'
    +'<div class="fld-row"><input class="inp" type="number" id="dd-wt" placeholder="e.g. 70" step="any">'
    +'<select class="usel" id="dd-wu"><option value="kg">kg</option><option value="lb">lb</option></select></div></div>'
    +'<div class="fld"><label class="fld-lbl">Doses per day</label>'
    +'<div class="fld-row"><input class="inp" type="number" id="dd-freq" placeholder="e.g. 3" step="1">'
    +'<div class="ubadge">x/day</div></div></div>'
    +'<div class="btns"><button class="btn btn-p" onclick="calcDose()">&#9654; Calculate</button>'
    +'<button class="btn btn-s" onclick="clrDose()">Clear</button></div>'
    +'<div id="dd-res"></div></div>';
}

function buildIV(col){
  return '<div class="cv-hd" style="background:linear-gradient(135deg,'+col+','+col+'cc);color:#fff">'
    +'<button class="cc-close" onclick="closeConv()">\u00d7</button>'
    +'<div style="font-size:22px;margin-bottom:4px">\u{1F3E5}</div>'
    +'<div style="font-size:16px;font-weight:700">IV Drip Rate Calculator</div>'
    +'<div style="font-size:11px;opacity:.8;margin-top:2px">Infusion rate and drop rate</div></div>'
    +'<div class="cc-body">'
    +'<div class="fld"><label class="fld-lbl">Volume to Infuse</label>'
    +'<div class="fld-row"><input class="inp" type="number" id="iv-vol" placeholder="e.g. 500" step="any">'
    +'<select class="usel" id="iv-vu"><option value="1">mL</option><option value="1000">L</option></select></div></div>'
    +'<div class="fld"><label class="fld-lbl">Infusion Duration</label>'
    +'<div class="fld-row"><input class="inp" type="number" id="iv-time" placeholder="e.g. 4" step="any">'
    +'<select class="usel" id="iv-tu"><option value="60">hours</option><option value="1">minutes</option></select></div></div>'
    +'<div class="fld"><label class="fld-lbl">Drop Factor</label>'
    +'<div class="fld-row"><input class="inp" type="number" id="iv-gtts" placeholder="e.g. 20" step="1">'
    +'<div class="ubadge">gtts/mL</div></div></div>'
    +'<div class="btns"><button class="btn btn-p" onclick="calcIV()">&#9654; Calculate</button>'
    +'<button class="btn btn-s" onclick="clrIV()">Clear</button></div>'
    +'<div id="iv-res"></div></div>';
}

function buildBMI(col){
  return '<div class="cv-hd" style="background:linear-gradient(135deg,'+col+','+col+'cc);color:#fff">'
    +'<button class="cc-close" onclick="closeConv()">\u00d7</button>'
    +'<div style="font-size:22px;margin-bottom:4px">\u{1F464}</div>'
    +'<div style="font-size:16px;font-weight:700">BMI + IBW + BSA</div>'
    +'<div style="font-size:11px;opacity:.8;margin-top:2px">Body composition calculator</div></div>'
    +'<div class="cc-body">'
    +'<div class="fld"><label class="fld-lbl">Weight</label>'
    +'<div class="fld-row"><input class="inp" type="number" id="bmi-wt" placeholder="e.g. 70" step="any">'
    +'<select class="usel" id="bmi-wu"><option value="kg">kg</option><option value="lb">lb</option></select></div></div>'
    +'<div class="fld"><label class="fld-lbl">Height</label>'
    +'<div class="fld-row"><input class="inp" type="number" id="bmi-ht" placeholder="e.g. 170" step="any">'
    +'<select class="usel" id="bmi-hu"><option value="cm">cm</option><option value="in">in</option><option value="ft">ft</option></select></div></div>'
    +'<div class="sex-row"><div class="sx on" id="bmiM" onclick="bmiSex=\'M\';document.getElementById(\'bmiM\').className=\'sx on\';document.getElementById(\'bmiF\').className=\'sx\'">&#9794; Male</div>'
    +'<div class="sx" id="bmiF" onclick="bmiSex=\'F\';document.getElementById(\'bmiF\').className=\'sx on\';document.getElementById(\'bmiM\').className=\'sx\'">&#9792; Female</div></div>'
    +'<div class="btns"><button class="btn btn-p" onclick="calcBMI()">&#9654; Calculate</button>'
    +'<button class="btn btn-s" onclick="clrBMI()">Clear</button></div>'
    +'<div id="bmi-res"></div></div>';
}

/* ── Init ── */
renderMed();
renderConv();
var footerYearEl = document.getElementById('footer-year');
if (footerYearEl) footerYearEl.textContent = new Date().getFullYear();
</script>
